<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Space Dodger — Sprite Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#4dc8ff;touch-action:none}
#app{position:fixed;inset:0;background:#000}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
#scan{position:absolute;inset:0;pointer-events:none;z-index:3;background:repeating-linear-gradient(to bottom,rgba(0,160,255,.018) 0,rgba(0,160,255,.018) 1px,transparent 1px,transparent 4px)}
#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:0;right:0;z-index:4;display:flex;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:700;letter-spacing:.05em;text-shadow:0 0 7px #008cff;pointer-events:none}
#bossbar{position:absolute;top:43px;left:12%;right:12%;height:7px;border:1px solid #7433a5;border-radius:5px;z-index:4;display:none;overflow:hidden;background:#120719}
#bossfill{height:100%;width:100%;background:#d33cff;box-shadow:0 0 8px #b600ff}
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:88px;z-index:4;color:#51caff;font-size:10px;white-space:nowrap;text-shadow:0 0 6px #008cff;pointer-events:none}
#controls{position:absolute;left:0;right:0;bottom:max(12px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:space-between;padding:0 16px}
#controls .group{display:flex;gap:10px}
button{width:58px;height:50px;border:1px solid #008fd0;border-radius:11px;background:rgba(0,18,30,.72);color:#64d5ff;font:700 20px monospace;box-shadow:0 0 8px rgba(0,140,255,.18);touch-action:none}
button:active{background:rgba(0,80,120,.85);transform:scale(.96)}
#overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.91);padding:24px}
.panel{width:min(90vw,430px)}
h1{margin:0 0 10px;color:#00aaff;font-size:clamp(27px,8vw,46px);letter-spacing:.1em;text-shadow:0 0 12px rgba(0,170,255,.5)}
h2{margin:0 0 10px;color:#ff4d6d}
p{margin:6px 0;color:#75d8ff;font-size:11px;line-height:1.6}
.panel button{width:220px;height:48px;font-size:11px;margin-top:10px}
#sensor{margin-top:12px;border:1px solid #06445d;border-radius:9px;padding:8px;color:#478fa8;font-size:9px}
#sensor b{color:#9be5ff}
.hidden{display:none!important}
</style>
</head>

<div id="app">
<canvas id="game"></canvas><div id="scan"></div>

<div id="status"></div>
<div id="controls">
 <div class="group"><button id="left">‹</button><button id="right">›</button></div>

</div>

const imgs={};
for(const [k,src] of Object.entries(SPRITES)){const im=new Image();im.src=src;imgs[k]=im}
const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

const scoreEl=document.getElementById("score"),hiEl=document.getElementById("hi"),livesEl=document.getElementById("lives");
const overlay=document.getElementById("overlay"),title=document.getElementById("title"),subtitle=document.getElementById("subtitle"),desc=document.getElementById("desc");
const motionBtn=document.getElementById("motionBtn"),startBtn=document.getElementById("startBtn"),pauseBtn=document.getElementById("pause"),boostBtn=document.getElementById("boost");
const mx=document.getElementById("mx"),my=document.getElementById("my"),mstate=document.getElementById("mstate"),bossbar=document.getElementById("bossbar"),bossfill=document.getElementById("bossfill"),statusEl=document.getElementById("status");

let best=Number(localStorage.getItem("spaceDodgerBest")||0),score=0,lives=3,level=1;
let running=false,paused=false,over=false,last=0,raf=0,spawnTimer=0,shootTimer=0,boss=null,bossSpawned=false;
let tilt=false,motionSeen=false,neutral=0,gamma=0,beta=0,permissionBusy=false;
let player={x:W/2,y:H-120,w:70,h:90,inv:0,speed:430,shield:0,rapid:0,boost:0};
let bullets=[],enemyBullets=[],enemies=[],asteroids=[],explosions=[],powerups=[],stars=[];
let keys={left:false,right:false},drag=false;

function initStars(){stars=Array.from({length:Math.max(70,Math.floor(W*H/12000))},()=>({x:Math.random()*W,y:Math.random()*H,s:.6+Math.random()*2,v:20+Math.random()*55,a:.35+Math.random()*.65}))}
function updateHUD(){scoreEl.textContent=String(Math.floor(score)).padStart(5,"0");hiEl.textContent=String(Math.floor(best)).padStart(5,"0");livesEl.textContent="♥".repeat(Math.max(0,lives))}
function reset(){
 score=0;lives=3;level=1;spawnTimer=0;shootTimer=0;boss=null;bossSpawned=false;bullets=[];enemyBullets=[];enemies=[];asteroids=[];explosions=[];powerups=[];
 player.x=W/2;player.y=H-120;player.inv=2;player.shield=0;player.rapid=0;player.boost=0;initStars();bossbar.style.display="none";updateHUD();
}
function sprite(name,x,y,w,h,flip=false,alpha=1){
 const im=imgs[name];if(!im.complete)return;ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore()
}
function onOrientation(e){
 if(typeof e.gamma==="number"&&Number.isFinite(e.gamma)){gamma=e.gamma;mx.textContent=gamma.toFixed(1)+"°";motionSeen=true;mstate.textContent="YES"}
 if(typeof e.beta==="number"&&Number.isFinite(e.beta)){beta=e.beta;my.textContent=beta.toFixed(1)+"°"}
}
async function enableMotion(){
 if(permissionBusy)return;permissionBusy=true;
 try{
  if(typeof DeviceOrientationEvent==="undefined"){motionBtn.textContent="TILT UNAVAILABLE";permissionBusy=false;return}
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
   const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted"){motionBtn.textContent="TILT DENIED";permissionBusy=false;return}
  }
  addEventListener("deviceorientation",onOrientation,true);tilt=true;motionBtn.textContent="TILT ENABLED";motionBtn.disabled=true;
  setTimeout(()=>{if(motionSeen){neutral=gamma;statusEl.textContent="TILT READY"}},700);
 }catch(e){motionBtn.textContent="TILT FAILED"}
 permissionBusy=false;
}
function calibrate(){if(motionSeen)neutral=gamma}
function spawnEnemy(){
 const types=["enemy1","enemy2","enemy3"],type=Math.floor(Math.random()*3),w=[55,58,62][type],h=[70,72,75][type];
 enemies.push({type,x:w/2+Math.random()*(W-w),y:-70,w,h,v:70+level*6+Math.random()*55,hp:1+(type===2?1:0),shoot:.5+Math.random()*1.6,t:0});
}
function spawnAsteroid(){
 const names=["asteroid1","asteroid2","asteroid3","asteroid4","asteroid5"],name=names[Math.floor(Math.random()*names.length)];
 const s=55+Math.random()*55;
 asteroids.push({name,x:s/2+Math.random()*(W-s),y:-70,s,v:70+level*7+Math.random()*60,rot:(Math.random()-.5)*2});
}
function fire(){
 bullets.push({x:player.x,y:player.y-50,v:760,w:18,h:50,power:player.rapid>0?2:1});
}
function enemyFire(e){
 const dx=player.x-e.x,dy=player.y-e.y,len=Math.hypot(dx,dy)||1;
 let type=e.type===0?"bullet_red":e.type===1?"bullet_purple":"bullet_green";
 enemyBullets.push({x:e.x,y:e.y+e.h*.3,vx:dx/len*(130+level*4),vy:dy/len*(130+level*4),type,w:24,h:45});
 if(e.type===1&&level>3){enemyBullets.push({x:e.x-18,y:e.y+20,vx:-55,vy:190,type,w:24,h:45});enemyBullets.push({x:e.x+18,y:e.y+20,vx:55,vy:190,type,w:24,h:45})}
}
function spawnBoss(){
 boss={x:W/2,y:145,w:Math.min(W*.7,330),h:260,hp:80,maxHp:80,vx:125,shoot:.8,t:0};
 bossSpawned=true;bossbar.style.display="block";statusEl.textContent="WARNING — BOSS INCOMING";
}
function hitPlayer(){
 if(player.inv>0||player.shield>0)return;
 lives--;player.inv=2;player.shield=1.2;explosions.push({x:player.x,y:player.y,kind:"large",t:0});
 if(navigator.vibrate)navigator.vibrate([60,40,100]);
 if(lives<=0){gameOver();return}
 updateHUD();
}
function collide(a,b,rx,ry){return Math.abs(a.x-b.x)<rx&&Math.abs(a.y-b.y)<ry}
function killEnemy(i){
 const e=enemies[i];score+=25*(e.type+1);explosions.push({x:e.x,y:e.y,kind:"small",t:0});if(Math.random()<.08)powerups.push({x:e.x,y:e.y,type:["health","rapid","speed","score"][Math.floor(Math.random()*4)],v:80});enemies.splice(i,1)
}
function update(dt){
 if(paused||over)return;
 timeAlive+=dt;level=1+Math.floor(timeAlive/18);
 if(player.inv>0)player.inv-=dt;if(player.shield>0)player.shield-=dt;if(player.rapid>0)player.rapid-=dt;if(player.boost>0)player.boost-=dt;
 let dir=0;if(keys.left)dir--;if(keys.right)dir++;
 if(tilt&&motionSeen){const d=gamma-neutral,dead=3;if(Math.abs(d)>dead)dir=Math.sign(d)*Math.min(1,(Math.abs(d)-dead)/20)}
 const speed=player.speed*(player.boost>0?1.5:1);player.x=Math.max(45,Math.min(W-45,player.x+dir*speed*dt));
 for(const s of stars){s.y+=s.v*dt*(1+level*.035);if(s.y>H){s.y=-2;s.x=Math.random()*W}}
 shootTimer+=dt;const fireRate=player.rapid>0?.09:.18;if(shootTimer>=fireRate){shootTimer=0;fire()}
 spawnTimer+=dt;const interval=Math.max(.28,.85-level*.028);
 if(spawnTimer>=interval){spawnTimer=0;if(Math.random()<.55)spawnEnemy();else spawnAsteroid()}
 if(!bossSpawned&&timeAlive>38){spawnBoss()}
 for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.y-=b.v*dt;if(b.y<-60){bullets.splice(i,1);continue}
  let removed=false;
  for(let j=enemies.length-1;j>=0;j--){const e=enemies[j];if(collide(b,e,Math.min(30,e.w*.35),Math.min(38,e.h*.35))){e.hp-=b.power;score+=5;bullets.splice(i,1);if(e.hp<=0)killEnemy(j);removed=true;break}}
  if(removed)continue;
  if(boss&&collide(b,boss, boss.w*.42,boss.h*.38)){boss.hp-=b.power;score+=2;bullets.splice(i,1);if(boss.hp<=0){explosions.push({x:boss.x,y:boss.y,kind:"large",t:0});score+=1000;boss=null;bossbar.style.display="none";statusEl.textContent="BOSS DESTROYED!"}continue}
 }
 for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];e.y+=e.v*dt;e.t+=dt;e.x+=Math.sin(e.t*2.2)*25*dt;e.shoot-=dt;if(e.shoot<=0){e.shoot=1+Math.random()*1.8;enemyFire(e)}if(e.y>H+100){enemies.splice(i,1);continue}if(player.inv<=0&&collide(player,e,38,45)){enemies.splice(i,1);hitPlayer()}}
 for(let i=asteroids.length-1;i>=0;i--){const a=asteroids[i];a.y+=a.v*dt;a.x+=Math.sin(a.y*.01)*18*dt;if(a.y>H+100){asteroids.splice(i,1);continue}if(player.inv<=0&&Math.hypot(player.x-a.x,player.y-a.y)<a.s*.32+35){asteroids.splice(i,1);hitPlayer()}}
 for(let i=enemyBullets.length-1;i>=0;i--){const b=enemyBullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y>H+70||b.x<-80||b.x>W+80){enemyBullets.splice(i,1);continue}if(player.inv<=0&&Math.hypot(player.x-b.x,player.y-b.y)<28){enemyBullets.splice(i,1);hitPlayer()}}
 if(boss){boss.x+=boss.vx*dt;if(boss.x<boss.w*.5||boss.x>W-boss.w*.5)boss.vx*=-1;boss.shoot-=dt;boss.t+=dt;if(boss.shoot<=0){boss.shoot=.55;enemyFire({x:boss.x,y:boss.y,w:boss.w,h:boss.h,type:1})}bossfill.style.width=(100*boss.hp/boss.maxHp)+"%"}
 for(let i=powerups.length-1;i>=0;i--){const p=powerups[i];p.y+=p.v*dt;if(p.y>H+40){powerups.splice(i,1);continue}if(Math.hypot(player.x-p.x,player.y-p.y)<38){if(p.type==="health")lives=Math.min(5,lives+1);if(p.type==="rapid")player.rapid=8;if(p.type==="speed")player.boost=8;if(p.type==="score")score+=250;powerups.splice(i,1);updateHUD()}}
 for(let i=explosions.length-1;i>=0;i--){explosions[i].t+=dt;if(explosions[i].t>.65)explosions.splice(i,1)}
 if(score>best){best=Math.floor(score);localStorage.setItem("spaceDodgerBest",best)}
 updateHUD();
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.fillStyle=`rgba(80,200,255,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill()}
 for(const a of asteroids)sprite(a.name,a.x,a.y,a.s,a.s);
 for(const e of enemies)sprite(["enemy1","enemy2","enemy3"][e.type],e.x,e.y,e.w,e.h);
 if(boss)sprite("boss",boss.x,boss.y,boss.w,boss.h);
 for(const b of bullets)sprite("bullet_blue",b.x,b.y,b.w,b.h);
 for(const b of enemyBullets)sprite(b.type,b.x,b.y,b.w,b.h);
 for(const p of powerups){const nm={health:"power_health",rapid:"power_shield",speed:"power_speed",score:"power_score"}[p.type];sprite(nm,p.x,p.y,38,38)}
 for(const ex of explosions){let name;if(ex.kind==="small")name=ex.t<.16?"exp_s1":ex.t<.32?"exp_s2":ex.t<.48?"exp_s3":"exp_s3";else name=ex.t<.16?"exp_l1":ex.t<.32?"exp_l2":ex.t<.48?"exp_l3":"exp_l4";sprite(name,ex.x,ex.y,ex.kind==="small"?70:130,ex.kind==="small"?70:130)}
 let pSprite="player";if(keys.left)pSprite="player_left";else if(keys.right)pSprite="player_right";if(player.inv>0&&Math.floor(player.inv*10)%2===0)pSprite="player_hit";sprite(pSprite,player.x,player.y,90,105);
}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function start(){reset();over=false;paused=false;running=true;overlay.style.display="none";last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function gameOver(){over=true;running=false;title.textContent="GAME OVER";subtitle.textContent="SCORE "+String(Math.floor(score)).padStart(5,"0");desc.textContent="Tap START GAME to fly again.";startBtn.textContent="RESTART";overlay.style.display="flex";if(navigator.vibrate)navigator.vibrate(120)}
function moveTouch(e){const r=c.getBoundingClientRect();player.x=Math.max(45,Math.min(W-45,(e.clientX-r.left)/r.width*W))}
c.addEventListener("pointerdown",e=>{if(!running||paused)return;drag=true;moveTouch(e);c.setPointerCapture?.(e.pointerId)});
c.addEventListener("pointermove",e=>{if(drag)moveTouch(e)});c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);
function hold(btn,key){btn.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true});["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,()=>keys[key]=false))}
hold(document.getElementById("left"),"left");hold(document.getElementById("right"),"right");
motionBtn.addEventListener("click",enableMotion);
startBtn.addEventListener("click",()=>{if(motionSeen)calibrate();start()});
pauseBtn.addEventListener("click",()=>{if(!running)return;paused=!paused;pauseBtn.textContent=paused?"▶":"Ⅱ";statusEl.textContent=paused?"PAUSED":""});
boostBtn.addEventListener("pointerdown",e=>{e.preventDefault();player.boost=3});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;if(e.key===" ")paused=!paused});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false});
initStars();updateHUD();draw();
})();
</script>
</body>
</html>
