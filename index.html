<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Space Dodger — Sprite Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{touch-action:none}
#app{position:fixed;inset:0;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
#scan{position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(to bottom,rgba(0,170,255,.018) 0,rgba(0,170,255,.018) 1px,transparent 1px,transparent 4px)}
#hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:0;right:0;z-index:4;display:flex;justify-content:space-between;padding:10px 16px;color:#00aaff;font-size:12px;text-shadow:0 0 8px #0077aa;pointer-events:none}
#sensor{position:absolute;top:max(42px,calc(env(safe-area-inset-top) + 42px));left:50%;transform:translateX(-50%);z-index:4;color:#4dbde8;font-size:9px;white-space:nowrap;background:rgba(0,0,0,.45);padding:4px 7px;border-radius:5px;pointer-events:none}
#controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));z-index:4;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}
.ctrl{pointer-events:auto;min-width:76px;min-height:46px;border:1px solid #008fca;border-radius:10px;background:rgba(0,20,30,.68);color:#61d4ff;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace}
.ctrl:active{background:#06455c}
#overlay{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.panel{width:min(92vw,430px)}
h1{margin:0 0 12px;color:#00aaff;font-size:clamp(26px,8vw,44px);letter-spacing:.08em;text-shadow:0 0 12px rgba(0,170,255,.45)}
.panel p{margin:7px 0;color:#79d8ff;font-size:11px;line-height:1.6}
.action{display:block;width:240px;margin:12px auto 0;min-height:48px;border:1px solid #008fca;border-radius:10px;background:#001923;color:#55ccff;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace}
.action:active{background:#06455c}
#gameover{display:none}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div id="scan"></div>
<div id="hud"><span>SCORE <b id="score">00000</b></span><span>HI <b id="hi">00000</b></span><span>LIVES <b id="lives">♥♥♥</b></span></div>
<div id="sensor">TILT: <b id="motion">NO</b> &nbsp; X:<b id="gx">--</b></div>
<div id="controls">
<button class="ctrl" id="left">◀</button>
<button class="ctrl" id="right">▶</button>
</div>
<div id="overlay">
<div class="panel" id="menu">
<h1>SPACE DODGER</h1>
<p>SPRITE EDITION</p>
<p>YOUR ORIGINAL PIXEL SPRITES • FULL SCREEN</p>
<p>Tap ENABLE TILT, allow motion access, then START.</p>
<button class="action" id="enable">ENABLE TILT</button>
<button class="action" id="start">START GAME</button>
</div>
<div class="panel" id="gameover">
<h1>GAME OVER</h1>
<p>SCORE <b id="finalScore">00000</b></p>
<button class="action" id="restart">PLAY AGAIN</button>
</div>
</div>
</div>

const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){
 W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
 c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);
 c.style.width=W+"px";c.style.height=H+"px";
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(player){player.y=H-135;player.x=Math.max(35,Math.min(W-35,player.x))}
 initStars();draw();
}
addEventListener("resize",resize);

const imgs={};
let loaded=0;
const needed=Object.keys(A);
for(const k of needed){
 const im=new Image();im.onload=()=>{loaded++;};im.src=A[k];imgs[k]=im;
}

let best=Number(localStorage.getItem("spaceDodgerSpriteBest")||0);
let score=0,level=1,lives=3,time=0,last=0,raf=0,running=false,paused=false;
let spawnTimer=0,shootTimer=0,enemyTimer=0,boss=null,bossTimer=0;
let motionEnabled=false,motionSeen=false,neutralGamma=0,gamma=0,beta=0,calibrated=false,permissionBusy=false;
let left=false,right=false,drag=false;
let stars=[],bullets=[],enemyBullets=[],enemies=[],asteroids=[],explosions=[],powerups=[];
let player={x:W/2,y:H-135,w:70,h:82,inv:0,hitAnim:0,speed:430};

function initStars(){
 stars=Array.from({length:Math.max(70,Math.floor(W*H/11500))},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()<.85?1:2,v:30+Math.random()*70}));
}
function imgReady(n){return imgs[n]&&imgs[n].complete&&imgs[n].naturalWidth>0}
function drawImg(name,x,y,w,h,angle=0,alpha=1){
 const im=imgs[name];if(!im||!im.naturalWidth)return;
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(x,y);
 if(angle)ctx.rotate(angle);
 ctx.drawImage(im,-w/2,-h/2,w,h);ctx.restore();
}
function fitSprite(name,maxW,maxH){
 const im=imgs[name];if(!im||!im.naturalWidth)return [maxW,maxH];
 const s=Math.min(maxW/im.naturalWidth,maxH/im.naturalHeight);
 return [im.naturalWidth*s,im.naturalHeight*s];
}
function reset(){
 score=0;level=1;lives=3;time=0;spawnTimer=0;shootTimer=0;enemyTimer=0;boss=null;bossTimer=0;
 bullets=[];enemyBullets=[];enemies=[];asteroids=[];explosions=[];powerups=[];
 player.x=W/2;player.y=H-135;player.inv=1.5;player.hitAnim=0;initStars();updateHud();
}
function updateHud(){
 document.getElementById("score").textContent=String(Math.floor(score)).padStart(5,"0");
 document.getElementById("hi").textContent=String(Math.floor(best)).padStart(5,"0");
 document.getElementById("lives").textContent="♥".repeat(lives)+"♡".repeat(Math.max(0,3-lives));
}
function orientation(e){
 if(typeof e.gamma==="number"&&Number.isFinite(e.gamma)){
  gamma=e.gamma;motionSeen=true;
  document.getElementById("motion").textContent="YES";
  document.getElementById("gx").textContent=gamma.toFixed(1)+"°";
 }
 if(typeof e.beta==="number"&&Number.isFinite(e.beta))beta=e.beta;
}
async function enableTilt(){
 if(permissionBusy)return;permissionBusy=true;
 try{
  if(typeof DeviceOrientationEvent==="undefined")throw new Error("unsupported");
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
   const r=await DeviceOrientationEvent.requestPermission();
   if(r!=="granted")throw new Error("denied");
  }
  addEventListener("deviceorientation",orientation,true);
  motionEnabled=true;
  document.getElementById("enable").textContent="TILT ENABLED";
  setTimeout(()=>{if(motionSeen){neutralGamma=gamma;calibrated=true}},900);
 }catch(e){
  document.getElementById("enable").textContent="TILT UNAVAILABLE";
 }
 permissionBusy=false;
}
function calibrate(){if(motionSeen){neutralGamma=gamma;calibrated=true}}

function spawnEnemy(){
 const types=["enemy1","enemy2","enemy3"];
 const type=types[Math.floor(Math.random()*types.length)];
 enemies.push({
  type,x:50+Math.random()*(W-100),y:-60,
  w:type==="enemy1"?72:76,h:type==="enemy1"?82:88,
  vy:55+level*4+Math.random()*45,vx:(Math.random()-.5)*35,
  shoot:1.0+Math.random()*1.8,phase:Math.random()*6.28
 });
}
function spawnAsteroid(){
 const names=["asteroid_big","asteroid_med","asteroid_small"];
 const type=names[Math.floor(Math.random()*names.length)];
 const [sw,sh]=fitSprite(type,110,110);
 const size=type==="asteroid_big"?80:type==="asteroid_med"?62:46;
 asteroids.push({type,x:size+Math.random()*(W-size*2),y:-size, w:size,h:size,vy:80+level*6+Math.random()*80,rot:Math.random()*6.28,spin:(Math.random()-.5)*1.6});
}
function firePlayer(){
 bullets.push({x:player.x,y:player.y-48,v:650,w:18,h:42});
}
function fireEnemy(e){
 const type=e.type==="enemy1"?"enemy_bullet":e.type==="enemy2"?"enemy_bullet2":"enemy_bullet3";
 const speed=type==="enemy_bullet"?270:240;
 enemyBullets.push({type,x:e.x,y:e.y+35,v:speed,w:20,h:40});
}
function bossFire(){
 if(!boss)return;
 const type=Math.random()<.5?"enemy_bullet2":"enemy_bullet3";
 for(const dx of [-55,0,55])enemyBullets.push({type,x:boss.x+dx,y:boss.y+90,v:230+level*4,w:22,h:44});
}
function explode(x,y,big=false){
 explosions.push({x,y,life:big?0.8:0.5,big});
}
function addPowerup(){
 const names=["health","power","speed","score"];
 const type=names[Math.floor(Math.random()*names.length)];
 powerups.push({type,x:40+Math.random()*(W-80),y:-30,w:38,h:38,vy:90});
}
function hitPlayer(){
 if(player.inv>0)return;
 lives--;player.inv=1.5;player.hitAnim=.45;explode(player.x,player.y,true);
 if(navigator.vibrate)navigator.vibrate([60,40,80]);
 if(lives<=0)endGame();
}
function endGame(){
 running=false;cancelAnimationFrame(raf);
 if(score>best){best=Math.floor(score);localStorage.setItem("spaceDodgerSpriteBest",best)}
 updateHud();
 document.getElementById("finalScore").textContent=String(Math.floor(score)).padStart(5,"0");
 document.getElementById("menu").style.display="none";
 document.getElementById("gameover").style.display="block";
 document.getElementById("overlay").style.display="flex";
}
function update(dt){
 time+=dt;score+=dt*12;level=1+Math.floor(time/18);
 if(player.inv>0)player.inv-=dt;if(player.hitAnim>0)player.hitAnim-=dt;
 let dir=0;if(left)dir--;if(right)dir++;
 if(motionEnabled&&motionSeen&&calibrated){
  const d=gamma-neutralGamma;
  if(Math.abs(d)>3)dir=Math.sign(d)*Math.min(1,(Math.abs(d)-3)/22);
 }
 player.x=Math.max(38,Math.min(W-38,player.x+dir*player.speed*dt));

 for(const s of stars){s.y+=s.v*dt*(1+level*.03);if(s.y>H){s.y=-3;s.x=Math.random()*W}}
 shootTimer+=dt;if(shootTimer>.24){shootTimer=0;firePlayer()}
 spawnTimer+=dt;
 if(spawnTimer>Math.max(.38,.9-level*.025)){spawnTimer=0;if(!boss){Math.random()<.55?spawnAsteroid():spawnEnemy()}}
 enemyTimer+=dt;
 if(enemyTimer>4.5&&level>=3&&!boss){enemyTimer=0;spawnEnemy()}
 if(Math.floor(time/60)>0&&!boss){boss={x:W/2,y:-170,w:220,h:190,hp:40+level*5,maxHp:40+level*5,dir:1,fire:1}}

 for(let i=bullets.length-1;i>=0;i--){
  const b=bullets[i];b.y-=b.v*dt;
  if(b.y<-60){bullets.splice(i,1);continue}
  let hit=false;
  for(let j=enemies.length-1;j>=0;j--){
   const e=enemies[j];
   if(Math.abs(b.x-e.x)<e.w*.38&&Math.abs(b.y-e.y)<e.h*.35){
    bullets.splice(i,1);explode(e.x,e.y,false);score+=40;enemies.splice(j,1);hit=true;break;
   }
  }
  if(hit)continue;
  for(let j=asteroids.length-1;j>=0;j--){
   const a=asteroids[j];
   if(Math.hypot(b.x-a.x,b.y-a.y)<a.w*.38){bullets.splice(i,1);explode(a.x,a.y,false);score+=15;asteroids.splice(j,1);hit=true;break}
  }
  if(hit)continue;
  if(boss&&Math.abs(b.x-boss.x)<boss.w*.45&&Math.abs(b.y-boss.y)<boss.h*.4){
   bullets.splice(i,1);boss.hp--;score+=10;explode(b.x,b.y,false);
   if(boss.hp<=0){explode(boss.x,boss.y,true);score+=1000;boss=null;}
  }
 }

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];e.y+=e.vy*dt;e.x+=e.vx*dt+Math.sin(time*2+e.phase)*20*dt;e.shoot-=dt;
  if(e.x<45||e.x>W-45)e.vx*=-1;
  if(e.shoot<=0){e.shoot=1.4+Math.random()*2;fireEnemy(e)}
  if(e.y>H+80){enemies.splice(i,1);continue}
  if(player.inv<=0&&Math.abs(player.x-e.x)<(e.w*.38+player.w*.25)&&Math.abs(player.y-e.y)<(e.h*.34+player.h*.25)){enemies.splice(i,1);hitPlayer()}
 }
 for(let i=asteroids.length-1;i>=0;i--){
  const a=asteroids[i];a.y+=a.vy*dt;a.rot+=a.spin*dt;
  if(a.y>H+100){asteroids.splice(i,1);continue}
  if(player.inv<=0&&Math.hypot(player.x-a.x,player.y-a.y)<a.w*.36+25){asteroids.splice(i,1);hitPlayer()}
 }
 for(let i=enemyBullets.length-1;i>=0;i--){
  const b=enemyBullets[i];b.y+=b.v*dt;
  if(b.y>H+50){enemyBullets.splice(i,1);continue}
  if(player.inv<=0&&Math.abs(b.x-player.x)<22&&Math.abs(b.y-player.y)<35){enemyBullets.splice(i,1);hitPlayer()}
 }
 for(let i=powerups.length-1;i>=0;i--){
  const p=powerups[i];p.y+=p.vy*dt;
  if(p.y>H+40){powerups.splice(i,1);continue}
  if(Math.hypot(p.x-player.x,p.y-player.y)<40){
   if(p.type==="health")lives=Math.min(3,lives+1);
   if(p.type==="score")score+=250;
   if(p.type==="speed")player.speed=540;
   if(p.type==="power")shootTimer=-.45;
   powerups.splice(i,1);updateHud();
  }
 }
 if(Math.random()<dt*.025&&level>=2)addPowerup();

 if(boss){
  if(boss.y<150)boss.y+=80*dt;
  else boss.x+=boss.dir*80*dt;
  if(boss.x<boss.w*.55||boss.x>W-boss.w*.55)boss.dir*=-1;
  boss.fire-=dt;if(boss.fire<=0){boss.fire=.8;bossFire()}
  if(player.inv<=0&&Math.abs(player.x-boss.x)<boss.w*.42&&Math.abs(player.y-boss.y)<boss.h*.35)hitPlayer();
 }

 for(let i=explosions.length-1;i>=0;i--){
  explosions[i].life-=dt;if(explosions[i].life<=0)explosions.splice(i,1)
 }
 if(score>best)best=Math.floor(score);updateHud();
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.fillStyle="rgba(40,175,255,.75)";ctx.fillRect(s.x,s.y,s.s,s.s)}
 for(const a of asteroids)drawImg(a.type,a.x,a.y,a.w,a.h,a.rot);
 for(const e of enemies){
  let name=e.type;drawImg(name,e.x,e.y,e.w,e.h,0);
 }
 for(const b of bullets)drawImg("bullet_blue",b.x,b.y,b.w,b.h);
 for(const b of enemyBullets)drawImg(b.type,b.x,b.y,b.w,b.h);
 for(const p of powerups)drawImg(p.type,p.x,p.y,p.w,p.h);
 if(boss){drawImg("boss",boss.x,boss.y,boss.w,boss.h);ctx.fillStyle="#111";ctx.fillRect(W*.2,Math.max(65,boss.y-boss.h*.58),W*.6,5);ctx.fillStyle="#ff2040";ctx.fillRect(W*.2,Math.max(65,boss.y-boss.h*.58),W*.6*(boss.hp/boss.maxHp),5)}
 for(const ex of explosions){
  const t=1-ex.life/(ex.big?.8:.5);const name=ex.big?"explosion_large":"explosion_small";const size=ex.big?120:70;
  drawImg(name,ex.x,ex.y,size*(.55+t),size*(.55+t),0,Math.max(0,ex.life/(ex.big?.8:.5)));
 }
 if(!running||player.inv<=0||Math.floor(player.inv*14)%2===0){
  const shipName=left?"player_left":right?"player_right":player.hitAnim>0?"player_hit":"player";
  drawImg(shipName,player.x,player.y,player.hitAnim>0?88:78,player.hitAnim>0?90:88);
 }
}
function loop(t){if(!running||paused)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function moveTouch(e){const r=c.getBoundingClientRect();player.x=Math.max(38,Math.min(W-38,(e.clientX-r.left)/r.width*W))}
c.addEventListener("pointerdown",e=>{if(!running)return;drag=true;moveTouch(e);c.setPointerCapture?.(e.pointerId)});
c.addEventListener("pointermove",e=>{if(drag)moveTouch(e)});
c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);
function hold(btn,key){
 btn.addEventListener("pointerdown",e=>{e.preventDefault();if(key==="l")left=true;else right=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,()=>{if(key==="l")left=false;else right=false}));
}
hold(document.getElementById("left"),"l");hold(document.getElementById("right"),"r");

document.getElementById("enable").addEventListener("click",enableTilt);
document.getElementById("start").addEventListener("click",()=>{
 if(motionEnabled&&!calibrated)calibrate();
 reset();running=true;document.getElementById("overlay").style.display="none";last=performance.now();raf=requestAnimationFrame(loop);
});
document.getElementById("restart").addEventListener("click",()=>{
 document.getElementById("gameover").style.display="none";reset();running=true;document.getElementById("overlay").style.display="none";last=performance.now();raf=requestAnimationFrame(loop);
});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=true;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=true});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=false;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=false});
initStars();resize();
})();
</script>
</body>
</html>
