<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#161433">
<title>Emberfox – a side-scrolling platformer</title>
<meta name="description" content="Run, jump and stomp across the mesas at dusk. A tiny side scroller that runs right in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#161433; --dusk:#2b2a5c; --rose:#e0567a; --amber:#ffb347; --cream:#fff1d6;
    --ui:rgba(255,241,214,.14); --ui-line:rgba(255,241,214,.4);
    --font:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;overscroll-behavior:none;
    background:var(--night) radial-gradient(120% 90% at 50% 100%,#3a2660 0%,var(--night) 62%) fixed;
    color:var(--cream);font-family:var(--font);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;
  }
  #app{position:fixed;inset:0}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{
    position:relative;width:min(100vw,calc(100vh * 16 / 9),1280px);aspect-ratio:16/9;
    background:#120f2e;border-radius:clamp(0px,1.2vw,16px);overflow:hidden;
    box-shadow:0 24px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,241,214,.08);
  }
  @supports (height:100dvh){ #stage{width:min(100vw,calc(100dvh * 16 / 9),1280px)} }
  canvas{display:block;width:100%;height:100%}

  #tools{
    position:absolute;z-index:5;display:flex;gap:8px;
    top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));
  }
  .tool{
    width:42px;height:42px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:2px solid var(--ui-line);background:rgba(22,20,51,.62);color:var(--cream);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  }
  .tool:hover{background:rgba(224,86,122,.55)}
  .tool:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
  .tool svg{width:20px;height:20px;fill:currentColor;stroke:currentColor}
  #muteBtn .x{display:none}
  #muteBtn.muted .wave{display:none}
  #muteBtn.muted .x{display:block}

  #touch{
    display:none;position:absolute;left:0;right:0;bottom:0;z-index:4;pointer-events:none;
    justify-content:space-between;align-items:flex-end;
    padding:0 max(20px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  }
  body.touch #touch{display:flex}
  #touch > *{pointer-events:auto;touch-action:none}
  #pad{
    display:flex;width:min(46vw,230px);height:88px;border-radius:44px;overflow:hidden;
    border:2px solid var(--ui-line);background:var(--ui);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  #pad span{flex:1;display:grid;place-items:center;transition:background .06s}
  #pad svg{width:30px;height:30px;fill:var(--cream);opacity:.9}
  #pad.l span:first-child,#pad.r span:last-child{background:rgba(255,179,71,.5)}
  #jumpBtn{
    width:100px;height:100px;border-radius:50%;padding:0;cursor:pointer;
    border:2px solid var(--ui-line);background:rgba(255,179,71,.3);color:var(--cream);
    font:600 21px var(--font);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  #jumpBtn.on{background:rgba(255,179,71,.7);transform:scale(.96)}
  #actions{display:flex;align-items:flex-end;gap:14px}
  #fireBtn{
    display:none;width:84px;height:84px;border-radius:50%;padding:0;cursor:pointer;
    border:2px solid var(--ui-line);background:rgba(224,86,122,.36);color:var(--cream);
    font:600 19px var(--font);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  }
  #fireBtn.show{display:block}
  #fireBtn.on{background:rgba(224,86,122,.78);transform:scale(.96)}
  noscript{position:fixed;inset:0;display:grid;place-items:center;font-size:20px}

  /* Phone held upright: turn the whole game 90° so it always plays in landscape.
     (Android can also lock landscape for real – see tryLandscapeLock in the script.) */
  body.rot #app{
    inset:auto;top:0;left:100vw;width:100vh;height:100vw;
    transform-origin:0 0;transform:rotate(90deg);
  }
  body.rot #stage{width:min(100vh,calc(100vw * 16 / 9),1280px);border-radius:0}
  body.rot #tools{top:max(10px,env(safe-area-inset-right));right:max(10px,env(safe-area-inset-bottom))}
  body.rot #touch{
    padding:0 max(20px,env(safe-area-inset-bottom)) max(22px,env(safe-area-inset-left)) max(20px,env(safe-area-inset-top));
  }
  @supports (height:100dvh){
    body.rot #app{left:100dvw;width:100dvh;height:100dvw}
    body.rot #stage{width:min(100dvh,calc(100dvw * 16 / 9),1280px)}
  }
</style>
</head>
<body>
<div id="app">
<div id="wrap">
  <div id="stage"><canvas id="game" aria-label="Emberfox game"></canvas></div>
</div>

<div id="tools">
  <button class="tool" id="pauseBtn" aria-label="Pause">
    <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <button class="tool" id="muteBtn" aria-label="Toggle sound">
    <svg viewBox="0 0 24 24">
      <path d="M4 9v6h4l5 4V5L8 9H4z"/>
      <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2" stroke-linecap="round"/>
      <path class="x" d="M16 9l5 6M21 9l-5 6" fill="none" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<div id="touch">
  <div id="pad" aria-label="Move left or right">
    <span><svg viewBox="0 0 24 24"><path d="M16 4L6 12l10 8z"/></svg></span>
    <span><svg viewBox="0 0 24 24"><path d="M8 4l10 8-10 8z"/></svg></span>
  </div>
  <div id="actions">
    <button id="fireBtn" aria-label="Shoot">Fire</button>
    <button id="jumpBtn" aria-label="Jump">Jump</button>
  </div>
</div>
</div>

<noscript>Emberfox needs JavaScript to run.</noscript>

<script>
(() => {
'use strict';

/* ------------------------------------------------------------------ *
 *  Emberfox – a side scroller in a single file.
 *  Move: ← → / A D     Jump: Space / ↑ / W (press again in mid-air)
 *  Fire (after grabbing a flame orb): X / Shift / Z / J
 *  Pause: P / Esc      Sound: M
 * ------------------------------------------------------------------ */

const W = 800, H = 450, STEP = 1000 / 60;
const FONT = "'Fredoka','Trebuchet MS',system-ui,sans-serif";
const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d'), stageEl = $('stage');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let isTouch = window.matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');
window.addEventListener('touchstart', () => {
  if (!isTouch) { isTouch = true; document.body.classList.add('touch'); resize(); }
}, { passive: true, once: true });

// Upright phone -> rotate the game so it is always landscape.
const isRotated = () => document.body.classList.contains('rot');
function updateRot(){
  document.body.classList.toggle('rot', isTouch && window.innerHeight > window.innerWidth);
}
// Android/Chrome: go fullscreen and lock to landscape on the first tap (needs a user gesture).
function tryLandscapeLock(e){
  if (e.pointerType !== 'touch') return;
  const el = document.documentElement;
  Promise.resolve()
    .then(() => (!document.fullscreenElement && el.requestFullscreen) ? el.requestFullscreen({ navigationUI:'hide' }) : null)
    .then(() => (screen.orientation && screen.orientation.lock) ? screen.orientation.lock('landscape') : null)
    .catch(() => {});
}
window.addEventListener('pointerdown', tryLandscapeLock, { once: true });

/* ---------- helpers ---------- */
const rand  = (a, b) => a + Math.random() * (b - a);
const irand = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hit = (a, b, i = 0) => a.x + i < b.x + b.w && a.x + a.w - i > b.x && a.y + i < b.y + b.h && a.y + a.h - i > b.y;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ---------- canvas sizing (crisp on hi-dpi) ---------- */
let scale = 1;
function resize(){
  updateRot();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const cssW = stageEl.clientWidth || W;
  scale = Math.max(1, cssW * dpr / W);
  canvas.width = Math.round(W * scale);
  canvas.height = Math.round(H * scale);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

/* ---------- audio (tiny synth, no files) ---------- */
let actx = null, muted = store.get('emberfox-muted') === '1';
function ensureAudio(){
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(freq, dur, type = 'square', vol = .05, slide = 0, delay = 0){
  if (muted || !actx) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + .03);
}
const sfx = {
  jump:  () => beep(300, .15, 'square', .045, 320),
  air:   () => beep(440, .13, 'square', .04, 300),
  coin:  () => { beep(880, .08, 'triangle', .07); beep(1320, .14, 'triangle', .07, 0, .06); },
  stomp: () => beep(220, .13, 'sawtooth', .06, -130),
  hurt:  () => beep(200, .32, 'sawtooth', .07, -150),
  heart: () => { beep(520, .1, 'triangle', .07); beep(780, .1, 'triangle', .07, 0, .08); beep(1040, .16, 'triangle', .07, 0, .16); },
  shoot: () => beep(760, .09, 'square', .028, -420),
  power: () => { beep(440, .09, 'triangle', .07); beep(660, .09, 'triangle', .07, 0, .07); beep(880, .09, 'triangle', .07, 0, .14); beep(1320, .2, 'triangle', .07, 0, .21); },
  over:  () => { beep(330, .2, 'triangle', .07, -60); beep(260, .2, 'triangle', .07, -60, .2); beep(180, .5, 'triangle', .07, -60, .4); }
};
const muteBtn = $('muteBtn');
muteBtn.classList.toggle('muted', muted);
function toggleMute(){
  muted = !muted; store.set('emberfox-muted', muted ? '1' : '0');
  muteBtn.classList.toggle('muted', muted);
  if (!muted) { ensureAudio(); beep(660, .08, 'triangle', .06); }
}

/* ---------- world constants ---------- */
const GRAV = .55, MAXFALL = 13, RUN = 4.4, JUMP = -11.2, AIRJUMP = -9.6;
const POWER_TIME = 720;              // 12 s of flame tail per orb
const TIP = { x:30, y:-27 };         // tail tip, relative to the fox's feet (facing = +x)

/* ---------- state ---------- */
let state = 'menu';               // menu | play | pause | over
let platforms, coins, enemies, hazards, pickups, parts, floaters, bolts;
let genX, lastY, cam, player, lives, bonus, embers, dist, shake, t = 0, drift = 0;
let lastOrb = 0, hintMsg = '', hintT = 0, fireShown = false;
let overTimer = 0, newBest = false, finalScore = 0;
let best = parseInt(store.get('emberfox-best') || '0', 10) || 0;

const input = { left:false, right:false, fire:false, jumpHeld:false, jumpPressed:false, jumpReleased:false };
const held  = { kbL:false, kbR:false, kbJ:false, kbF:false, tL:false, tR:false, tJ:false, tF:false };

/* ---------- scenery (built once) ---------- */
const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
[[0,'#120f2e'],[.42,'#2b2a5c'],[.68,'#8d3b78'],[.86,'#e0567a'],[1,'#ffb347']].forEach(([o,c]) => skyGrad.addColorStop(o, c));
const sunGrad = ctx.createRadialGradient(0,0,0,0,0,78);
sunGrad.addColorStop(0,'#fff1d6'); sunGrad.addColorStop(.55,'#ffb347'); sunGrad.addColorStop(1,'#e0567a');
const sunGlow = ctx.createRadialGradient(0,0,50,0,0,240);
sunGlow.addColorStop(0,'rgba(255,179,71,.38)'); sunGlow.addColorStop(1,'rgba(255,179,71,0)');
const playerGlow = ctx.createRadialGradient(0,0,0,0,0,110);
playerGlow.addColorStop(0,'rgba(255,190,90,.26)'); playerGlow.addColorStop(1,'rgba(255,190,90,0)');
const vignette = ctx.createRadialGradient(W/2,H/2,H*.45,W/2,H/2,W*.72);
vignette.addColorStop(0,'rgba(10,6,30,0)'); vignette.addColorStop(1,'rgba(10,6,30,.55)');

const stars = Array.from({length:70}, () => ({ x:Math.random()*W, y:Math.random()*230, r:Math.random()*1.5+.6, p:Math.random()*6 }));
const amb = Array.from({length:34}, () => ({ x:Math.random()*W, y:Math.random()*H, s:rand(1,2.6), v:rand(.15,.5), f:rand(.6,1.25), ph:Math.random()*6 }));

function makeLayer(seed, count, tile, hMin, hMax, color, factor, slant){
  const r = mulberry32(seed), blocks = [];
  for (let i = 0; i < count; i++)
    blocks.push({ x:i*tile/count + r()*40, w:110 + r()*120, h:hMin + r()*(hMax-hMin), s:slant*(.6 + r()*.8) });
  return { blocks, tile, color, factor };
}
const layers = [
  makeLayer(11, 7, 1600, 150, 240, '#5a2f6e', .12, 26),
  makeLayer(23, 8, 1600, 110, 190, '#3b2761', .25, 20),
  makeLayer(37, 9, 1600,  70, 140, '#251b49', .45, 14)
];
function drawLayer(L, camX){
  ctx.fillStyle = L.color;
  const off = -((camX * L.factor) % L.tile);
  for (let k = -1; k <= 2; k++){
    const bx = off + k * L.tile;
    for (const b of L.blocks){
      const x = bx + b.x;
      if (x > W || x + b.w < 0) continue;
      ctx.beginPath();
      ctx.moveTo(x, H); ctx.lineTo(x + b.s, H - b.h); ctx.lineTo(x + b.w - b.s, H - b.h); ctx.lineTo(x + b.w, H);
      ctx.closePath(); ctx.fill();
    }
  }
}

/* ---------- level generation ---------- */
function addGround(x, y, w){ platforms.push({ x, y, w, h:H - y + 300, one:false, g:true }); }
function addFloat(x, y, w){ platforms.push({ x, y, w, h:14, one:true, g:false }); }

function addSegment(){
  const d = clamp((genX - 800) / 9000, 0, 1);              // difficulty 0..1
  const gap = Math.random() < .5 + .25*d ? irand(70, 100 + Math.round(50*d)) : 0;
  const minY = lastY - (gap > 120 ? 20 : 55);
  let ny = Math.round((lastY + rand(-60, 60)) / 10) * 10;
  ny = clamp(Math.max(ny, minY), 250, 380);
  const w = irand(220, 480);
  const gx = genX + gap;

  if (gap > 0){
    if (Math.random() < .7){                                // ember arc over the gap
      for (let i = 0; i < 5; i++){
        const f = i / 4;
        coins.push({ x:genX - 10 + (gap + 40) * f, y:Math.min(lastY, ny) - 50 - Math.sin(f*Math.PI)*70, ph:Math.random()*6 });
      }
    }
    if (gap >= 105 && Math.random() < .5) addFloat(genX + gap/2 - 30, Math.round((lastY + ny)/2) - 25, 60);
  }

  addGround(gx, ny, w);

  if (Math.random() < .55){                                 // ember row
    const n = irand(3, 6), arc = Math.random() < .5, sx = gx + w/2 - (n-1)*14;
    for (let i = 0; i < n; i++)
      coins.push({ x:sx + i*28, y:ny - 34 - (arc ? Math.sin(i/(n-1)*Math.PI)*46 : 0), ph:Math.random()*6 });
  }

  const r = Math.random();
  const pThorn = (w > 300 && genX > 1000) ? .18 + .32*d : 0;
  const pBeetle = (w >= 260 && genX > 900) ? .3 + .3*d : 0;
  if (r < pThorn){
    const n = irand(2, 3);
    hazards.push({ x:gx + rand(60, w - 60 - n*24), y:ny - 18, w:n*24, h:18, n });
  } else if (r < pThorn + pBeetle){
    const spd = rand(.6, 1 + .5*d);
    enemies.push({ k:'beetle', x:gx + w*rand(.3,.6), y:ny - 20, w:28, h:20, vx:(Math.random()<.5?-1:1)*spd,
                   minX:gx + 6, maxX:gx + w - 6, dead:0, ph:Math.random()*6 });
  }

  if (w > 300 && Math.random() < .3){                       // floating ledge
    const fx = gx + rand(60, w - 160), fy = ny - 95;
    addFloat(fx, fy, 100);
    for (let i = 0; i < 3; i++) coins.push({ x:fx + 26 + i*24, y:fy - 20, ph:Math.random()*6 });
    if (Math.random() < .14) pickups.push({ x:fx + 50, y:fy - 34, k:'heart' });
  }

  if (genX > 1600 && Math.random() < .1 + .3*d){            // moth
    const y0 = ny - rand(75, 115);
    enemies.push({ k:'moth', x:gx + w*rand(.4,.9), y:y0, y0, w:26, h:20, vx:-rand(.4,.9), dead:0, ph:Math.random()*6 });
  }

  if (genX > 1400 && gx - lastOrb > 1100 && Math.random() < .4){   // flame orb
    pickups.push({ x:gx + w * .3, y:ny - 36, k:'power' });
    lastOrb = gx;
  }

  genX = gx + w; lastY = ny;
}
function generate(until){ while (genX < until) addSegment(); }

function cleanup(){
  const lim = cam.x - 400;
  platforms = platforms.filter(p => p.x + p.w > lim);
  coins     = coins.filter(c => !c.got && c.x > lim);
  hazards   = hazards.filter(h => h.x + h.w > lim);
  pickups   = pickups.filter(p => !p.got && p.x > lim);
  enemies   = enemies.filter(e => e.x + e.w > lim && e.dead < 25);
}

/* ---------- game flow ---------- */
function resetGame(){
  platforms = []; coins = []; enemies = []; hazards = []; pickups = []; parts = []; floaters = []; bolts = [];
  cam = { x:0 };
  addGround(-300, 340, 1100);
  pickups.push({ x:620, y:304, k:'power' });        // first flame orb, right on the path
  lastOrb = 620; hintT = 0; hintMsg = '';
  genX = 800; lastY = 340;
  generate(W + 600);
  player = { x:120, y:340 - 30, w:22, h:30, vx:0, vy:0, facing:1, onGround:true, coyote:0, airJumps:1,
             jumpBuf:0, inv:0, stun:0, prevBottom:340, preVy:0,
             power:0, powerT:0, cd:0, recoil:0 };
  lives = 3; bonus = 0; embers = 0; dist = player.x; shake = 0; newBest = false;
}
function score(){ return Math.floor(Math.max(0, dist - 120) / 12) + bonus; }

function startIfIdle(){
  ensureAudio();
  if (state === 'menu' || (state === 'over' && overTimer <= 0)){
    resetGame(); state = 'play';
    input.jumpPressed = false; input.jumpReleased = false;
  }
}
function togglePause(){
  if (state === 'play') state = 'pause';
  else if (state === 'pause') state = 'play';
}
function gameOver(){
  state = 'over'; overTimer = 55; finalScore = score();
  if (finalScore > best){ best = finalScore; newBest = true; store.set('emberfox-best', String(best)); }
  sfx.over();
}
function respawn(){
  const p = player; let target = null;
  for (const pl of platforms) if (pl.g && pl.x + pl.w > cam.x + 160){ target = pl; break; }
  if (!target) target = platforms.find(pl => pl.g) || platforms[0];
  p.x = clamp(Math.max(target.x + 30, cam.x + 70), target.x + 20, target.x + target.w - 50);
  p.y = target.y - p.h - 2; p.vx = 0; p.vy = 0; p.inv = 130; p.stun = 0; p.airJumps = 1;
}
function hurt(srcX){
  const p = player;
  if (p.inv > 0 || state !== 'play') return;
  lives--; p.inv = 100; p.stun = 14; p.vy = -6;
  p.vx = (p.x + p.w/2 < srcX ? -1 : 1) * 4.5;
  shake = reduceMotion ? 0 : 10; sfx.hurt();
  burst(p.x + p.w/2, p.y + p.h/2, 10, '#ff4f6d');
  if (lives <= 0) gameOver();
}
function burst(x, y, n, color){
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx:rand(-2.4,2.4), vy:rand(-3.4,.6), g:.13, life:irand(20,40), c:color, s:rand(2,4.2) });
}
function dust(x, y, n){
  for (let i = 0; i < n; i++)
    parts.push({ x:x + rand(-6,6), y, vx:rand(-1.2,1.2), vy:rand(-.9,-.1), g:.02, life:irand(14,24), c:'rgba(255,241,214,.55)', s:rand(2,3.6) });
}

/* ---------- update ---------- */
function nearGround(p, d){
  for (const pl of platforms){
    if (p.x + p.w <= pl.x || p.x >= pl.x + pl.w) continue;
    const g = pl.y - (p.y + p.h);
    if (g >= -1 && g <= d) return true;
  }
  return false;
}
function updatePlayer(){
  const p = player;

  if (p.stun > 0) p.stun--;
  else {
    const dir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (dir){
      const turn = dir * p.vx < 0 ? 2 : 1;
      p.vx += dir * (p.onGround ? .6 : .4) * turn; p.facing = dir;
    } else p.vx *= p.onGround ? .78 : .95;
    if (Math.abs(p.vx) < .05) p.vx = 0;
    p.vx = clamp(p.vx, -RUN, RUN);
  }

  if (p.onGround){ p.coyote = 6; p.airJumps = 1; } else if (p.coyote > 0) p.coyote--;

  const doJump = () => {
    p.vy = JUMP; p.coyote = 0; p.jumpBuf = 0; p.onGround = false;
    sfx.jump(); dust(p.x + p.w/2, p.y + p.h, 5);
  };
  if (input.jumpPressed){
    if (p.onGround || p.coyote > 0) doJump();
    else if (p.vy > 0 && nearGround(p, 26)) p.jumpBuf = 8;          // buffer a landing jump
    else if (p.airJumps > 0){
      p.vy = AIRJUMP; p.airJumps--; sfx.air();
      for (let i = 0; i < 6; i++) parts.push({ x:p.x + p.w/2, y:p.y + p.h, vx:Math.cos(i)*1.6, vy:Math.abs(Math.sin(i))*1.2, g:.02, life:18, c:'rgba(255,179,71,.8)', s:3 });
    } else p.jumpBuf = 8;
  } else if (p.jumpBuf > 0){
    p.jumpBuf--;
    if (p.onGround) doJump();
  }
  if (input.jumpReleased && p.vy < -3.5) p.vy *= .5;                  // variable jump height

  if (p.cd > 0) p.cd--;
  if (p.recoil > 0) p.recoil--;
  if (p.power > 0){
    if (--p.powerT <= 0) p.power = 0;
    else if (input.fire && p.cd <= 0 && p.stun <= 0) shoot();
  }

  p.vy = Math.min(p.vy + GRAV, MAXFALL);
  movePlayer();

  if (p.inv > 0) p.inv--;
  if (p.y > H + 70){
    lives--; sfx.hurt(); shake = reduceMotion ? 0 : 8;
    if (lives <= 0) gameOver(); else respawn();
  }
  dist = Math.max(dist, p.x);
}
function movePlayer(){
  const p = player, wasAir = !p.onGround;
  p.prevBottom = p.y + p.h; p.preVy = p.vy;

  p.x += p.vx;
  if (p.x < cam.x + 2){ p.x = cam.x + 2; if (p.vx < 0) p.vx = 0; }
  for (const pl of platforms){
    if (pl.one) continue;
    if (p.x < pl.x + pl.w - .01 && p.x + p.w > pl.x + .01 && p.y < pl.y + pl.h - .01 && p.y + p.h > pl.y + .01){
      if (p.vx > 0) p.x = pl.x - p.w; else if (p.vx < 0) p.x = pl.x + pl.w;
      p.vx = 0;
    }
  }

  p.y += p.vy; p.onGround = false;
  for (const pl of platforms){
    if (p.x + p.w <= pl.x + .01 || p.x >= pl.x + pl.w - .01) continue;
    if (pl.one){
      if (p.vy >= 0 && p.prevBottom <= pl.y + .01 && p.y + p.h > pl.y){ p.y = pl.y - p.h; p.vy = 0; p.onGround = true; }
    } else if (p.y < pl.y + pl.h && p.y + p.h > pl.y){
      if (p.vy >= 0){ if (p.prevBottom <= pl.y + 1){ p.y = pl.y - p.h; p.vy = 0; p.onGround = true; } }
      else if (p.y - p.vy >= pl.y + pl.h - 1){ p.y = pl.y + pl.h; p.vy = 0; }
    }
  }
  if (p.onGround && wasAir && p.preVy > 4) dust(p.x + p.w/2, p.y + p.h, 6);
}
function shoot(){
  const p = player, dir = p.facing;
  const x = p.x + p.w / 2 + dir * TIP.x, y = p.y + p.h + TIP.y;
  const angles = p.power > 1 ? [-.2, 0, .2] : [0];
  for (const a of angles) bolts.push({ x, y, vx:dir * Math.cos(a) * 9, vy:Math.sin(a) * 9, life:70 });
  p.cd = p.power > 1 ? 18 : 12; p.recoil = 6; sfx.shoot();
  for (let i = 0; i < 3; i++)
    parts.push({ x, y, vx:dir * rand(.5, 2), vy:rand(-1, 1), g:0, life:12, c:'rgba(255,241,214,.9)', s:rand(2, 3.4) });
}
function updateBolts(){
  for (const b of bolts){
    b.x += b.vx; b.y += b.vy; b.life--;
    if (Math.random() < .6)
      parts.push({ x:b.x, y:b.y, vx:rand(-.3, .3), vy:rand(-.4, .4), g:0, life:12, c:'rgba(255,179,71,.85)', s:rand(2, 3.5) });
    for (const e of enemies){
      if (e.dead) continue;
      // a little vertical forgiveness so bolts fired at head height still catch low beetles
      if (b.x + 6 > e.x - 4 && b.x - 6 < e.x + e.w + 4 && b.y + 6 > e.y - 12 && b.y - 6 < e.y + e.h){
        e.dead = 1; b.life = 0; bonus += 30; sfx.stomp();
        floaters.push({ x:e.x + e.w / 2, y:e.y, t:'+30', life:40 });
        burst(e.x + e.w / 2, e.y + e.h / 2, 8, e.k === 'beetle' ? '#8e5bd6' : '#ffe9c8');
        break;
      }
    }
    if (b.life > 0){
      for (const pl of platforms){
        if (pl.one) continue;
        if (b.x + 4 > pl.x && b.x - 4 < pl.x + pl.w && b.y + 4 > pl.y && b.y - 4 < pl.y + pl.h){
          b.life = 0; burst(b.x, b.y, 4, '#ffb347'); break;
        }
      }
    }
    if (b.x < cam.x - 80 || b.x > cam.x + W + 80) b.life = 0;
  }
  bolts = bolts.filter(b => b.life > 0);
}
function updateEntities(){
  for (const e of enemies){
    if (e.dead){ e.dead++; continue; }
    e.ph += .15;
    if (e.k === 'beetle'){
      e.x += e.vx;
      if (e.x < e.minX){ e.x = e.minX; e.vx = Math.abs(e.vx); }
      if (e.x + e.w > e.maxX){ e.x = e.maxX - e.w; e.vx = -Math.abs(e.vx); }
    } else { e.x += e.vx; e.y = e.y0 + Math.sin(e.ph * .7) * 28; }
  }
}
function interact(){
  const p = player, pc = { x:p.x + p.w/2, y:p.y + p.h/2 };
  for (const c of coins){
    if (c.got) continue;
    const dx = pc.x - c.x, dy = pc.y - c.y;
    if (dx*dx + dy*dy < 24*24){ c.got = true; embers++; bonus += 10; sfx.coin(); burst(c.x, c.y, 6, '#ffd88a'); }
  }
  for (const k of pickups){
    if (k.got) continue;
    const dx = pc.x - k.x, dy = pc.y - k.y;
    if (dx*dx + dy*dy < 28*28){
      k.got = true;
      if (k.k === 'power'){
        p.power = Math.min(2, p.power + 1); p.powerT = POWER_TIME;
        sfx.power(); burst(k.x, k.y, 14, '#ffb347');
        hintMsg = p.power > 1 ? 'Triple shot!' : (isTouch ? 'Flame tail! Tap Fire to shoot' : 'Flame tail! Hold X or Shift to shoot');
        hintT = 200;
      } else {
        sfx.heart(); burst(k.x, k.y, 10, '#ff8aa0');
        if (lives < 3) lives++; else { bonus += 100; floaters.push({ x:k.x, y:k.y, t:'+100', life:45 }); }
      }
    }
  }
  for (const e of enemies){
    if (e.dead || !hit(p, e, 3)) continue;
    if (p.vy > 0 && p.prevBottom <= e.y + e.h * .55){
      e.dead = 1; p.vy = input.jumpHeld ? -10.5 : -7.5; p.airJumps = 1; p.coyote = 0;
      bonus += 50; sfx.stomp(); shake = reduceMotion ? 0 : 3;
      floaters.push({ x:e.x + e.w/2, y:e.y, t:'+50', life:40 });
      burst(e.x + e.w/2, e.y + e.h/2, 8, e.k === 'beetle' ? '#8e5bd6' : '#ffe9c8');
    } else hurt(e.x + e.w/2);
  }
  for (const h of hazards){
    if (hit(p, { x:h.x + 3, y:h.y + 6, w:h.w - 6, h:h.h - 6 }, 2)) hurt(h.x + h.w/2);
  }
}
function updateParts(){
  for (const q of parts){ q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--; }
  parts = parts.filter(q => q.life > 0);
  for (const f of floaters){ f.y -= .6; f.life--; }
  floaters = floaters.filter(f => f.life > 0);
}
function updatePlay(){
  updatePlayer();
  interact();
  updateEntities();
  updateBolts();
  const target = player.x - 300;
  if (target > cam.x) cam.x += (target - cam.x) * .12;
  generate(cam.x + W + 500);
  if (t % 30 === 0) cleanup();
  updateParts();
}
function step(){
  if (state === 'pause'){ input.jumpPressed = input.jumpReleased = false; return; }
  t++;
  for (const a of amb){ a.y -= a.v; if (a.y < -8) a.y = H + 8; }
  if (shake > 0){ shake *= .88; if (shake < .3) shake = 0; }
  if (hintT > 0) hintT--;
  const showFire = (state === 'play' || state === 'pause') && player.power > 0;
  if (showFire !== fireShown){ fireShown = showFire; $('fireBtn').classList.toggle('show', showFire); }
  if (state === 'menu'){ drift += .5; updateParts(); }
  else if (state === 'play') updatePlay();
  else if (state === 'over'){ if (overTimer > 0) overTimer--; updateParts(); }
  input.jumpPressed = false; input.jumpReleased = false;
}

function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, size, color, align = 'left', weight = 600, stroke){
  ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  if (stroke){ ctx.lineWidth = stroke.w; ctx.strokeStyle = stroke.c; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }

function heart(x, y, s, c){

}

function drawEmber(c){

function flame(x, y, s, outer, inner){

function drawOrb(k){

  ctx.beginPath(); ctx.moveTo(11, -34); ctx.lineTo(13.5, -39); ctx.lineTo(14, -31); ctx.fill();
  ctx.fillStyle = '#fff1d6';

  const s = state === 'over' ? finalScore : score();
  txt(String(s), W / 2, 44, 36, '#fff1d6', 'center', 700, { w:6, c:'rgba(18,15,46,.8)' });
  txt('best ' + Math.max(best, s), W / 2, 66, 15, 'rgba(255,241,214,.8)', 'center', 500, { w:4, c:'rgba(18,15,46,.8)' });
  if (state !== 'over' && player.power > 0){
    const frac = clamp(player.powerT / POWER_TIME, 0, 1), bw = Math.max(1, 96 * frac);
    flame(22, 90, .75, '#ff7a3d', '#ffd88a');
    ctx.fillStyle = 'rgba(18,15,46,.65)'; rr(38, 84, 96, 12, 6); ctx.fill();
    ctx.fillStyle = player.power > 1 ? '#ff8aa0' : '#ffb347'; rr(38, 84, bw, 12, Math.min(6, bw / 2)); ctx.fill();
    if (player.power > 1) txt('triple', 142, 95, 14, '#fff1d6', 'left', 600, { w:4, c:'rgba(18,15,46,.8)' });
  }
  if (state === 'play' && hintT > 0){
    ctx.globalAlpha = clamp(hintT / 40, 0, 1);
    txt(hintMsg, W / 2, 132, 18, '#ffd88a', 'center', 600, { w:5, c:'rgba(18,15,46,.85)' });
    ctx.globalAlpha = 1;
  }
  if (state === 'play' && dist < 620){
    ctx.globalAlpha = clamp((620 - dist) / 200, 0, 1);
    txt('Press jump again in mid-air to double jump', W / 2, 104, 17, '#fff1d6', 'center', 500, { w:4, c:'rgba(18,15,46,.8)' });
    ctx.globalAlpha = 1;
  }
}
function blink(s, y, size = 24){
  ctx.globalAlpha = .6 + .4 * Math.sin(t * .08);
  txt(s, W / 2, y, size, '#ffb347', 'center', 600, { w:6, c:'rgba(18,15,46,.85)' });
  ctx.globalAlpha = 1;
}
function drawMenu(){
  txt('Emberfox', W / 2, 158, 88, '#e0567a', 'center', 700, { w:16, c:'#2a1240' });
  txt('Emberfox', W / 2, 152, 88, '#ffb347', 'center', 700, { w:0, c:'#2a1240' });
  txt('Follow the last light across the mesas.', W / 2, 196, 22, '#fff1d6', 'center', 500, { w:5, c:'rgba(18,15,46,.85)' });
  const lines = isTouch
    ? ['Left pad to move, right button to jump.', 'Tap jump again in mid-air for a double jump.', 'Grab a flame orb to unlock the Fire button.']
    : ['Move  ← →  or  A D', 'Jump  Space, ↑ or W  (again in mid-air)', 'Fire  X or Shift  (after grabbing a flame orb)'];
  lines.forEach((l, i) => txt(l, W / 2, 226 + i * 23, 16, 'rgba(255,241,214,.92)', 'center', 500, { w:4, c:'rgba(18,15,46,.85)' }));
  txt('Stomp beetles. Grab embers. Mind the thorns.', W / 2, 295, 16, 'rgba(255,241,214,.92)', 'center', 500, { w:4, c:'rgba(18,15,46,.85)' });
  blink(isTouch ? 'Tap to run' : 'Press Space to run', 330);
}
function drawOver(){
  ctx.fillStyle = 'rgba(18,15,46,.74)'; ctx.fillRect(0, 0, W, H);
  txt('The light went out', W / 2, 130, 50, '#fff1d6', 'center', 700, { w:8, c:'#2a1240' });
  txt(String(finalScore), W / 2, 226, 88, '#ffb347', 'center', 700, { w:14, c:'#2a1240' });
  txt(embers + (embers === 1 ? ' ember collected' : ' embers collected'), W / 2, 262, 20, '#fff1d6', 'center', 500);
  txt(newBest ? 'New best!' : 'Best ' + best, W / 2, 298, 24, newBest ? '#ff8aa0' : 'rgba(255,241,214,.8)', 'center', 600);
  if (overTimer <= 0) blink(isTouch ? 'Tap to try again' : 'Press Space to try again', 358);
}
function drawPause(){
  ctx.fillStyle = 'rgba(18,15,46,.7)'; ctx.fillRect(0, 0, W, H);
  txt('Paused', W / 2, 220, 60, '#fff1d6', 'center', 700, { w:10, c:'#2a1240' });
  txt(isTouch ? 'Tap the screen to resume' : 'Press P to resume', W / 2, 262, 20, 'rgba(255,241,214,.85)', 'center', 500);
}

function draw(){
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const par = cam.x + drift, camX = Math.round(cam.x);

  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, H);
  for (const s of stars){
    ctx.globalAlpha = .3 + .35 * Math.sin(t * .03 + s.p);
    ctx.fillStyle = '#fff1d6'; ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  ctx.save(); ctx.translate(W * .7, 318);
  ctx.fillStyle = sunGlow; ctx.fillRect(-240, -240, 480, 480);
  ctx.fillStyle = sunGrad; ctx.beginPath(); ctx.arc(0, 0, 78, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  for (const L of layers) drawLayer(L, par);

  const shx = shake > 0 ? (Math.random() - .5) * shake : 0, shy = shake > 0 ? (Math.random() - .5) * shake : 0;
  ctx.save(); ctx.translate(-camX + shx, shy);
  const L0 = camX - 60, R0 = camX + W + 60;

  for (const pl of platforms){ if (pl.x > R0 || pl.x + pl.w < L0) continue; pl.one ? drawFloat(pl) : drawGround(pl); }
  for (const h of hazards){ if (h.x > R0 || h.x + h.w < L0) continue; drawThorns(h); }
  for (const c of coins){ if (c.got || c.x < L0 || c.x > R0) continue; drawEmber(c); }
  for (const k of pickups){
    if (k.got || k.x < L0 || k.x > R0) continue;
    if (k.k === 'power'){ drawOrb(k); continue; }
    const bob = Math.sin(t * .07) * 3;
    ctx.fillStyle = 'rgba(255,79,109,.25)'; ctx.beginPath(); ctx.arc(k.x, k.y + bob, 16, 0, Math.PI * 2); ctx.fill();
    heart(k.x, k.y + bob - 4, 22, '#ff4f6d');
  }
  for (const e of enemies){ if (e.x > R0 || e.x + e.w < L0) continue; e.k === 'beetle' ? drawBeetle(e) : drawMoth(e); }

  if (state !== 'over' || lives > 0){
    const p = player;
    ctx.save(); ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = playerGlow; ctx.fillRect(-110, -110, 220, 220);
    ctx.restore(); ctx.globalCompositeOperation = 'source-over';
    if (!(p.inv > 0 && Math.floor(p.inv / 4) % 2 === 0)) drawFox(p);
  }
  for (const b of bolts) drawBolt(b);
  for (const q of parts){
    ctx.globalAlpha = clamp(q.life / 20, 0, 1); ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, q.s, q.s);
  }
  ctx.globalAlpha = 1;
  for (const f of floaters){
    ctx.globalAlpha = clamp(f.life / 20, 0, 1);
    txt(f.t, f.x, f.y, 20, '#fff1d6', 'center', 700, { w:5, c:'#2a1240' });
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawAmbient(par);
  ctx.fillStyle = vignette; ctx.fillRect(0, 0, W, H);

  if (state === 'menu') drawMenu();
  else { drawHUD(); if (state === 'over') drawOver(); if (state === 'pause') drawPause(); }
}

/* ---------- input ---------- */
function syncInput(){
  input.left = held.kbL || held.tL;
  input.right = held.kbR || held.tR;
  input.fire = held.kbF || held.tF;
  const j = held.kbJ || held.tJ;
  if (j && !input.jumpHeld){ input.jumpPressed = true; startIfIdle(); }
  if (!j && input.jumpHeld) input.jumpReleased = true;
  input.jumpHeld = j;
}
const FIRE_KEYS = ['KeyX', 'KeyZ', 'KeyJ', 'KeyK', 'ShiftLeft', 'ShiftRight'];
window.addEventListener('keydown', e => {
  const c = e.code;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)) e.preventDefault();
  ensureAudio();
  if (c === 'ArrowLeft' || c === 'KeyA') held.kbL = true;
  else if (c === 'ArrowRight' || c === 'KeyD') held.kbR = true;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') held.kbJ = true;
  else if (FIRE_KEYS.includes(c)) held.kbF = true;
  else if (c === 'Enter') startIfIdle();
  else if (c === 'KeyP' || c === 'Escape') { if (!e.repeat) togglePause(); }
  else if (c === 'KeyM') { if (!e.repeat) toggleMute(); }
  syncInput();
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'Space') e.preventDefault();
  if (c === 'ArrowLeft' || c === 'KeyA') held.kbL = false;
  else if (c === 'ArrowRight' || c === 'KeyD') held.kbR = false;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') held.kbJ = false;
  else if (FIRE_KEYS.includes(c)) held.kbF = false;
  syncInput();
});
function releaseAll(){
  Object.keys(held).forEach(k => held[k] = false);
  $('pad').classList.remove('l', 'r'); $('jumpBtn').classList.remove('on'); $('fireBtn').classList.remove('on');
  syncInput();
}
window.addEventListener('blur', () => { releaseAll(); if (state === 'play') state = 'pause'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });
document.addEventListener('contextmenu', e => e.preventDefault());

stageEl.addEventListener('pointerdown', () => {
  ensureAudio();
  if (state === 'pause') state = 'play'; else startIfIdle();
});

// on-screen controls
const pad = $('pad'), jumpBtn = $('jumpBtn');
function padUpdate(e){
  const r = pad.getBoundingClientRect();
  // when the game is rotated 90°, the pad's left→right axis runs top→bottom on screen
  const rel = isRotated() ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
  held.tL = rel < .5; held.tR = rel >= .5;
  pad.classList.toggle('l', held.tL); pad.classList.toggle('r', held.tR);
  syncInput();
}
function padEnd(){ held.tL = held.tR = false; pad.classList.remove('l', 'r'); syncInput(); }
pad.addEventListener('pointerdown', e => { e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch(_){} ensureAudio(); padUpdate(e); });
pad.addEventListener('pointermove', e => { if (pad.hasPointerCapture && pad.hasPointerCapture(e.pointerId)) padUpdate(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => pad.addEventListener(ev, padEnd));

function jumpEnd(){ held.tJ = false; jumpBtn.classList.remove('on'); syncInput(); }
jumpBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); try { jumpBtn.setPointerCapture(e.pointerId); } catch(_){}
  ensureAudio(); held.tJ = true; jumpBtn.classList.add('on'); syncInput();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => jumpBtn.addEventListener(ev, jumpEnd));

const fireBtn = $('fireBtn');
function fireEnd(){ held.tF = false; fireBtn.classList.remove('on'); syncInput(); }
fireBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); try { fireBtn.setPointerCapture(e.pointerId); } catch(_){}
  ensureAudio(); held.tF = true; fireBtn.classList.add('on'); syncInput();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => fireBtn.addEventListener(ev, fireEnd));

$('pauseBtn').addEventListener('click', e => { togglePause(); e.currentTarget.blur(); });
muteBtn.addEventListener('click', e => { toggleMute(); e.currentTarget.blur(); });

/* ---------- main loop ---------- */
resetGame();
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP){ step(); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
