<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Nokia Bounce - Mobile</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #1a2a1a;
    font-family: 'Courier New', monospace;
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 8px;
  }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 500px;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #9bc09b;
    border: 6px solid #3b4e3b;
    border-radius: 16px;
    box-shadow: 0 0 20px #000, inset 0 0 20px #4d6e4d;
    touch-action: none;
  }
  #score {
    color: #c8e0c8;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
    padding: 4px;
  }
  #controls {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 500px;
    justify-content: center;
    padding: 0 8px;
  }
  .btn {
    flex: 1;
    padding: 22px 0;
    font-size: 20px;
    font-weight: bold;
    font-family: inherit;
    border: none;
    border-radius: 16px;
    color: #1f2e1f;
    background: #7fa87f;
    box-shadow: 0 6px 0 #2b3e2b, 0 8px 12px rgba(0,0,0,0.4);
    letter-spacing: 1px;
    transition: transform 0.05s, box-shadow 0.05s;
    touch-action: manipulation;
    cursor: pointer;
  }
  .btn:active {
    transform: translateY(5px);
    box-shadow: 0 1px 0 #2b3e2b, 0 2px 6px rgba(0,0,0,0.5);
  }
  #bounceBtn {
    background: #a8d078;
    flex: 2;
    font-size: 22px;
  }
  #resetBtn {
    background: #d0a878;
    flex: 1;
    font-size: 16px;
  }
  @media (max-height: 600px) {
    .btn { padding: 16px 0; font-size: 16px; }
    #bounceBtn { font-size: 18px; }
    #score { font-size: 16px; }
  }
</style>
</head>
<body>

<div id="gameWrap">
  <canvas id="c" width="480" height="320"></canvas>
</div>
<div id="score">SCORE: 0 / 4</div>
<div id="controls">
  <button class="btn" id="resetBtn">↻ NEW</button>
  <button class="btn" id="bounceBtn">⬆ BOUNCE</button>
</div>

<script>
(function() {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bounceBtn = document.getElementById('bounceBtn');
  const resetBtn = document.getElementById('resetBtn');

  const W = 480, H = 320;
  const R = 13;
  const G = 0.22;
  const BOUNCE_FORCE = -5.0;
  const GROUND = H - 24;
  const WL = 8, WR = W - 8;

  let ball, rings, score, over, win;

  function reset() {
    ball = { x: 120, y: GROUND - R - 2, vx: 2.2, vy: 0 };
    rings = [
      { x: 280, y: 110, r: 20, a: true },
      { x: 400, y: 190, r: 18, a: true },
      { x: 200, y: 220, r: 19, a: true },
      { x: 340, y: 70,  r: 16, a: true }
    ];
    score = 0; over = false; win = false;
    updateScore();
  }

  function updateScore() {
    scoreEl.textContent = 'SCORE: ' + score + ' / 4';
  }

  function bounce() {
    if (over || win) { reset(); return; }
    ball.vy = BOUNCE_FORCE;
  }

  function update() {
    if (over || win) return;

    ball.vy += G;
    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - R < WL) { ball.x = WL + R; ball.vx = -ball.vx; }
    if (ball.x + R > WR) { ball.x = WR - R; ball.vx = -ball.vx; }

    if (ball.y + R > GROUND) {
      ball.y = GROUND - R;
      if (ball.vy > 0) {
        ball.vy = -ball.vy * 0.72;
        if (Math.abs(ball.vy) < 1.2) ball.vy = 0;
      }
    }

    if (ball.y - R < 8) {
      ball.y = 8 + R;
      if (ball.vy < 0) ball.vy = -ball.vy * 0.5;
    }

    for (const ring of rings) {
      if (!ring.a) continue;
      if (Math.hypot(ball.x - ring.x, ball.y - ring.y) < R + ring.r) {
        ring.a = false;
        score++;
        updateScore();
      }
    }

    if (!rings.some(r => r.a)) win = true;
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.strokeStyle = '#7fa87f';
    ctx.lineWidth = 0.5;
    for (let i = 0; i < W; i += 24) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, H); ctx.stroke();
    }
    for (let i = 0; i < H; i += 24) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(W, i); ctx.stroke();
    }

    ctx.fillStyle = '#3b5e3b';
    ctx.fillRect(0, 0, WL, H);
    ctx.fillRect(WR, 0, WL, H);

    ctx.fillStyle = '#4d6e4d';
    ctx.fillRect(0, GROUND, W, 6);
    ctx.fillStyle = '#2b3e2b';
    ctx.fillRect(0, GROUND + 4, W, 4);

    for (const ring of rings) {
      if (!ring.a) continue;
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r, 0, Math.PI * 2);
      ctx.strokeStyle = '#1e3a1e';
      ctx.lineWidth = 5;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, ring.r - 2, 0, Math.PI * 2);
      ctx.strokeStyle = '#f0f8b0';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(ring.x, ring.y, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#f0f8b0';
      ctx.fill();
    }

    ctx.beginPath();
    ctx.arc(ball.x, ball.y + 3, R, 0, Math.PI * 2);
    ctx.fillStyle = '#3f5a3f';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R, 0, Math.PI * 2);
    ctx.fillStyle = '#222';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ball.x - 4, ball.y - 4, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#c0e0c0';
    ctx.fill();

    if (over) {
      ctx.fillStyle = 'rgba(30,20,10,0.7)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f0d890';
      ctx.font = 'bold 30px Courier New';
      ctx.fillText('GAME OVER', 80, 160);
      ctx.font = 'bold 16px Courier New';
      ctx.fillText('tap BOUNCE to restart', 110, 200);
    } else if (win) {
      ctx.fillStyle = 'rgba(40,70,30,0.8)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#f8f0b0';
      ctx.font = 'bold 32px Courier New';
      ctx.fillText('YOU WIN!', 120, 160);
      ctx.font = 'bold 18px Courier New';
      ctx.fillText('tap BOUNCE to play again', 95, 210);
    }
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  bounceBtn.addEventListener('click', bounce);
  bounceBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    bounce();
  }, { passive: false });

  resetBtn.addEventListener('click', reset);
  resetBtn.addEventListener('touchstart', function(e) {
    e.preventDefault();
    reset();
  }, { passive: false });

  c.addEventListener('click', bounce);
  c.addEventListener('touchstart', function(e) {
    e.preventDefault();
    bounce();
  }, { passive: false });

  window.addEventListener('keydown', function(e) {
    if (e.code === 'Space' || e.key === 'ArrowUp') {
      e.preventDefault();
      bounce();
    }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  document.addEventListener('touchmove', function(e) {
    e.preventDefault();
  }, { passive: false });

  reset();
  loop();
})();
</script>
</body>
</html>
