<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Space Dodger V1.5</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#55ccff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{touch-action:none}
#app{position:absolute;inset:0;background:#000;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;touch-action:none}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,170,255,.018) 0,rgba(0,170,255,.018) 1px,transparent 1px,transparent 4px);z-index:2}
.controls{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;z-index:4;pointer-events:none}
button{pointer-events:auto;min-width:105px;min-height:48px;border:1px solid #087ca8;border-radius:10px;background:rgba(0,18,27,.72);color:#55ccff;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}
button:active{background:#06384b;transform:scale(.98)}
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.91);padding:24px}
.panel{width:min(92vw,430px)}
h1{font-size:clamp(24px,7vw,38px);letter-spacing:.12em;color:#00aaff;margin:0 0 14px;text-shadow:0 0 10px rgba(0,170,255,.45)}
p{font-size:12px;line-height:1.7;color:#7edaff;margin:6px 0}
.panel button{margin-top:14px;min-width:220px}
.diag{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:4;text-align:center;font-size:10px;color:#3d91ad;white-space:nowrap;background:rgba(0,0,0,.38);padding:4px 8px;border-radius:5px;pointer-events:none}
.diag b{color:#7edaff}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="Space Dodger"></canvas>
<div class="scan"></div>
<div class="diag">TILT <b id="motion">NO</b> &nbsp; X:<b id="gamma">--</b> &nbsp; Y:<b id="beta">--</b></div>
<div class="controls"><button id="left">◀ LEFT</button><button id="right">RIGHT ▶</button></div>
<div class="overlay" id="overlay">
<div class="panel">
<h1>SPACE DODGER</h1>
<p>ESP32 OLED EDITION</p>
<p>BLUE MONOCHROME • FULL SCREEN</p>
<p>TILT YOUR iPHONE TO STEER</p>
<button id="enable">ENABLE TILT</button>
<button id="play">START GAME</button>
</div>
</div>
</div>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d",{alpha:false});
const overlay=document.getElementById("overlay"),enable=document.getElementById("enable"),play=document.getElementById("play");
const motionEl=document.getElementById("motion"),gammaEl=document.getElementById("gamma"),betaEl=document.getElementById("beta");
const leftBtn=document.getElementById("left"),rightBtn=document.getElementById("right");
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=Math.max(320,innerWidth);H=Math.max(480,innerHeight);DPR=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*DPR);c.height=Math.round(H*DPR);c.style.width="100%";c.style.height="100%";ctx.setTransform(DPR,0,0,DPR,0,0);initStars();draw()}
addEventListener("resize",resize);

let best=Number(localStorage.getItem("sdBest")||0),score=0,level=1,timeAlive=0;
let running=false,last=0,raf=0,spawnTimer=0,hitFlash=0;
let motionEnabled=false,motionSeen=false,calibrated=false,neutral=0,gamma=0,beta=0,permissionBusy=false;
let player={x:W/2,y:H-115,speed:420,inv:0};
let rocks=[],particles=[],stars=[],left=false,right=false,drag=false;

function initStars(){
 stars=Array.from({length:Math.max(70,Math.floor(W*H/11000))},()=>({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.5,v:30+Math.random()*80,a:.35+Math.random()*.65}));
}
function onOrientation(e){
 if(typeof e.gamma==="number"&&Number.isFinite(e.gamma)){gamma=e.gamma;gammaEl.textContent=gamma.toFixed(1)+"°";motionSeen=true;motionEl.textContent="YES"}
 if(typeof e.beta==="number"&&Number.isFinite(e.beta)){beta=e.beta;betaEl.textContent=beta.toFixed(1)+"°"}
}
async function enableMotion(){
 if(permissionBusy)return;permissionBusy=true;
 try{
  if(typeof DeviceOrientationEvent==="undefined"){enable.textContent="TILT UNAVAILABLE";permissionBusy=false;return}
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
   const result=await DeviceOrientationEvent.requestPermission();
   if(result!=="granted"){enable.textContent="TILT DENIED";permissionBusy=false;return}
  }
  addEventListener("deviceorientation",onOrientation,true);motionEnabled=true;enable.textContent="TILT ENABLED";enable.disabled=true;
 }catch(e){enable.textContent="TILT FAILED"}
 permissionBusy=false;
}
function calibrate(){if(motionSeen){neutral=gamma;calibrated=true}}
function reset(){
 score=0;level=1;timeAlive=0;spawnTimer=0;hitFlash=0;rocks=[];particles=[];
 player.x=W/2;player.y=H-115;player.inv=1.4;initStars();draw();
}
function startGame(){
 reset();running=true;overlay.style.display="none";last=performance.now();raf=requestAnimationFrame(loop);
 if(motionEnabled&&!calibrated)setTimeout(calibrate,500);
}
function spawn(){
 const r=18+Math.random()*28+Math.min(18,level*.9);
 rocks.push({x:r+Math.random()*(W-r*2),y:-r-15,r,v:125+level*10+Math.random()*75,rot:Math.random()*6.28,spin:(Math.random()-.5)*2.2,kind:Math.random()});
 if(level>=4&&Math.random()<.2){const s=12+Math.random()*15;rocks.push({x:s+Math.random()*(W-s*2),y:-100,s,v:160+level*12,rot:Math.random()*6.28,spin:1.5,kind:.8,r:s})}
}
function explode(x,y){
 for(let i=0;i<26;i++){const a=Math.random()*Math.PI*2,v=45+Math.random()*190;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.65,r:1+Math.random()*3})}
}
function update(dt){
 timeAlive+=dt;score+=dt*10;level=1+Math.floor(timeAlive/15);if(player.inv>0)player.inv-=dt;
 let dir=0;if(left)dir--;if(right)dir++;
 if(motionEnabled&&motionSeen&&calibrated){const d=gamma-neutral,dead=3;if(Math.abs(d)>dead)dir=Math.sign(d)*Math.min(1,(Math.abs(d)-dead)/20)}
 player.x=Math.max(28,Math.min(W-28,player.x+dir*player.speed*dt));
 for(const s of stars){s.y+=s.v*dt*(1+level*.035);if(s.y>H){s.y=-2;s.x=Math.random()*W}}
 spawnTimer+=dt;const interval=Math.max(.22,.75-level*.026);if(spawnTimer>=interval){spawnTimer=0;spawn()}
 for(let i=rocks.length-1;i>=0;i--){
  const r=rocks[i];r.y+=r.v*dt;r.rot+=r.spin*dt;
  if(r.y>H+r.r+20){rocks.splice(i,1);continue}
  if(player.inv<=0&&Math.hypot(player.x-r.x,player.y-r.y)<r.r+23){
   explode(player.x,player.y);player.inv=1.25;hitFlash=.2;score=Math.max(0,score-25);rocks.splice(i,1);
   if(navigator.vibrate)navigator.vibrate(70)
  }
 }
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.992;p.vy*=.992;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 if(hitFlash>0)hitFlash-=dt;
 if(score>best){best=Math.floor(score);try{localStorage.setItem("sdBest",best)}catch(e){}}
}
function glow(){
 ctx.shadowColor="#00aaff";ctx.shadowBlur=7;
}
function noGlow(){ctx.shadowBlur=0}
function drawShip(){
 const x=player.x,y=player.y;
 glow();ctx.strokeStyle="#00aaff";ctx.fillStyle="#001522";ctx.lineWidth=2.2;
 ctx.beginPath();ctx.moveTo(x,y-25);ctx.lineTo(x-25,y+22);ctx.lineTo(x-10,y+15);ctx.lineTo(x,y+23);ctx.lineTo(x+10,y+15);ctx.lineTo(x+25,y+22);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.fillStyle="#00aaff";ctx.beginPath();ctx.moveTo(x,y-17);ctx.lineTo(x-7,y+8);ctx.lineTo(x+7,y+8);ctx.closePath();ctx.fill();
 ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(x,y-5,4.5,8,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#00aaff";ctx.stroke();
 ctx.fillStyle="#00aaff";ctx.fillRect(x-13,y+16,5,3);ctx.fillRect(x+8,y+16,5,3);
 ctx.globalAlpha=.8;ctx.fillRect(x-3,y+23,2,10);ctx.fillRect(x+1,y+23,2,10);ctx.globalAlpha=1;noGlow();
}
function drawAsteroid(r){
 ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);glow();ctx.strokeStyle="#00aaff";ctx.fillStyle="rgba(0,55,78,.18)";ctx.lineWidth=2;
 const pts=10;ctx.beginPath();
 for(let i=0;i<pts;i++){const a=i*Math.PI*2/pts,rr=r.r*(.78+.22*Math.sin(i*2.7+1.4));const x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
 ctx.closePath();ctx.fill();ctx.stroke();
 noGlow();ctx.strokeStyle="rgba(0,170,255,.65)";ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(-r.r*.25,-r.r*.1);ctx.lineTo(r.r*.05,r.r*.2);ctx.lineTo(r.r*.28,r.r*.05);ctx.stroke();
 ctx.restore();
}
function draw(){
 ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
 for(const s of stars){ctx.fillStyle=`rgba(0,170,255,${s.a})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
 for(const r of rocks)drawAsteroid(r);
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle="#00aaff";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 if(!running||player.inv<=0||Math.floor(player.inv*12)%2===0)drawShip();
 glow();ctx.fillStyle="#00aaff";ctx.font="600 13px ui-monospace,SFMono-Regular,Menlo,monospace";ctx.textBaseline="top";
 ctx.fillText("SCORE "+String(Math.floor(score)).padStart(5,"0"),18,Math.max(18,envSafeTop()+8));
 ctx.fillText("HI "+String(Math.floor(best)).padStart(5,"0"),W/2-35,Math.max(18,envSafeTop()+8));
 ctx.fillText("LV "+String(level).padStart(2,"0"),W-58,Math.max(18,envSafeTop()+8));
 noGlow();
 if(hitFlash>0){ctx.fillStyle="#00aaff";ctx.globalAlpha=.12;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
function envSafeTop(){return 0}
function loop(t){if(!running)return;const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function moveTouch(e){const r=c.getBoundingClientRect();player.x=Math.max(28,Math.min(W-28,(e.clientX-r.left)/r.width*W))}
c.addEventListener("pointerdown",e=>{if(!running)return;drag=true;moveTouch(e);c.setPointerCapture?.(e.pointerId)});
c.addEventListener("pointermove",e=>{if(drag)moveTouch(e)});
c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);
function hold(btn,key){
 btn.addEventListener("pointerdown",e=>{e.preventDefault();if(key==="l")left=true;else right=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,()=>{if(key==="l")left=false;else right=false}));
}
hold(leftBtn,"l");hold(rightBtn,"r");
enable.addEventListener("click",enableMotion);
play.addEventListener("click",()=>{if(motionEnabled&&!calibrated)calibrate();startGame()});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=true;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=true});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=false;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=false});
resize();
})();
</script>
</body>
</html>
