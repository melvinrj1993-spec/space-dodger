<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DHARMA: Yamaloka</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090604;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:3;top:max(10px,env(safe-area-inset-top));left:0;right:0;padding:12px 15px;display:flex;justify-content:space-between;font-size:12px;font-weight:800;text-shadow:0 2px 5px #000}.hp{color:#ff6559}.dharma{color:#ffd76a}.realm{color:#d2b8ff}
.btn{position:fixed;z-index:4;width:64px;height:64px;border-radius:50%;border:1px solid #a8753e;background:#1d1210cc;color:#ffe4ad;font-size:24px;box-shadow:0 3px 12px #0008}.atk{right:22px;bottom:max(28px,env(safe-area-inset-bottom) + 18px)}.dash{right:101px;bottom:max(91px,env(safe-area-inset-bottom) + 81px)}.astra{right:101px;bottom:max(19px,env(safe-area-inset-bottom) + 9px);font-size:13px}
.stick{position:fixed;z-index:4;left:22px;bottom:max(28px,env(safe-area-inset-bottom) + 18px);width:130px;height:130px;border-radius:50%;border:1px solid #806047;background:#24171188}.knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#e1bd8a33;border:1px solid #e4c18e88}
.overlay{position:fixed;z-index:10;inset:0;background:radial-gradient(circle at 50% 35%,#3a2017 0,#0a0604 58%);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.panel{width:min(92vw,520px)}
h1{font:700 clamp(40px,12vw,78px) Georgia,serif;letter-spacing:.04em;margin:0;color:#e7b85d;text-shadow:0 4px #5b1d16,0 0 25px #d77b3444}h2{font:700 30px Georgia;color:#e7b85d;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#d2c7bc}
.action,.boon{display:block;width:245px;margin:11px auto;padding:14px;border:1px solid #a8753e;border-radius:9px;background:#241611;color:#f5d78e;font-weight:800}.boon{width:100%;text-align:left}.boon b{display:block;color:#ffd36d;margin-bottom:4px}.small{font-size:11px;color:#aaa}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud"><span class="hp" id="hp">PRANA 100/100</span><span class="realm" id="realm">YAMALOKA • 1</span><span class="dharma" id="dharma">DHARMA 0</span></div>
<div class="stick" id="stick"><div class="knob" id="knob"></div></div>
<button class="btn atk" id="attack">⚔</button><button class="btn dash" id="dash">✦</button><button class="btn astra" id="astra">ASTRA</button>
<div class="overlay" id="overlay">
<div class="panel" id="menu">
<h1>DHARMA</h1><h2>YAMALOKA</h2>
<p>An original action roguelite inspired by Indian mythology. Descend through mythic realms, battle asuric forces, master astras and earn boons.</p>
<button class="action" id="start">BEGIN THE JOURNEY</button>
</div>
<div class="panel" id="boonPanel" style="display:none"><h2>DIVINE BOON</h2><p>Choose one blessing for your journey.</p><div id="choices"></div></div>
<div class="panel" id="dead" style="display:none"><h1>FALLEN</h1><p id="death"></p><button class="action" id="retry">RETURN TO THE PATH</button></div>
<div class="panel" id="win" style="display:none"><h1>DHARMA RESTORED</h1><p id="winText"></p><button class="action" id="again">JOURNEY AGAIN</button></div>
</div>
<script>
(()=>{"use strict";
const c=document.getElementById("game"),g=c.getContext("2d");let W=innerWidth,H=innerHeight,D=devicePixelRatio||1;
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener("resize",resize);resize();
const C={bg:"#090604",floor:"#17100d",gold:"#e7b85d",red:"#e65349",orange:"#ff934d",purple:"#a57be0",hero:"#d9c3a0",green:"#78bd76",white:"#fff4d5"};
let running=false,last=0,raf=0,realmN=1,dharma=0,score=0,en=[],shots=[],enemyShots=[],parts=[],exit=null,shake=0;
let P={x:W/2,y:H-145,r:18,hp:100,max:100,spd:235,dmg:28,inv:0,attack:0,dash:0,astra:0,crit:.05,astraDmg:22};
let keys={},joy={on:false,x:0,y:0},aim={x:1,y:0};
const hp=document.getElementById("hp"),realm=document.getElementById("realm"),dh=document.getElementById("dharma");
function hud(){hp.textContent=`PRANA ${Math.max(0,Math.ceil(P.hp))}/${P.max}`;realm.textContent=`${realmN===1?"YAMALOKA":realmN===2?"VANARA FOREST":realmN===3?"ASURA CITADEL":"DEVA GATE"} • ${realmN}`;dh.textContent=`DHARMA ${Math.floor(dharma)}`}
function part(x,y,col,n=12){for(let i=0;i<n;i++){let a=Math.random()*6.28,v=35+Math.random()*150;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.25+Math.random()*.5,m:.7,col})}}
function build(){en=[];shots=[];enemyShots=[];parts=[];exit={x:W/2,y:72,open:false};let count=3+realmN*2;for(let i=0;i<count;i++){let r=Math.random(),t=r<.48?"rakshasa":r<.8?"asura":"yaksha";let e={t,x:55+Math.random()*(W-110),y:105+Math.random()*(H-245),r:t==="asura"?26:t==="yaksha"?21:18,hp:(t==="asura"?80:t==="yaksha"?50:38)+realmN*10,spd:t==="asura"?38:t==="yaksha"?48:65,fire:1+Math.random()*2,hit:0};e.max=e.hp;en.push(e)}}
function start(){realmN=1;dharma=0;score=0;P.max=100;P.hp=100;P.spd=235;P.dmg=28;P.astraDmg=22;P.crit=.05;P.x=W/2;P.y=H-145;build();hide();running=true;last=performance.now();raf=requestAnimationFrame(loop);hud()}
function hide(){overlay.style.display="none"}function show(id){for(const q of ["menu","boonPanel","dead","win"])document.getElementById(q).style.display="none";document.getElementById(id).style.display="block";overlay.style.display="flex"}
function hurt(n){if(P.inv>0)return;P.hp-=n;P.inv=.65;shake=.18;part(P.x,P.y,C.red,18);if(navigator.vibrate)navigator.vibrate(35);if(P.hp<=0){running=false;death.textContent=`The journey ended in ${realmN===1?"Yamaloka":realmN===2?"the Vanara Forest":realmN===3?"the Asura Citadel":"the Deva Gate"}. Dharma earned: ${Math.floor(dharma)}.`;show("dead")}}
function attack(){if(!running||P.attack>0)return;P.attack=.28;part(P.x+aim.x*25,P.y+aim.y*25,C.gold,7);for(let i=en.length-1;i>=0;i--){let e=en[i],dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<P.r+e.r+58&&(dx/d)*aim.x+(dy/d)*aim.y>.05){e.hp-=P.dmg*(Math.random()<P.crit?2:1);e.hit=.1;part(e.x,e.y,C.orange,7);if(e.hp<=0){score+=e.t==="asura"?70:30;dharma+=e.t==="yaksha"?12:8;part(e.x,e.y,C.red,18);en.splice(i,1)}}}}
function dash(){if(!running||P.dash>0)return;let dx=aim.x,dy=aim.y;if(joy.on){dx=joy.x;dy=joy.y}let l=Math.hypot(dx,dy)||1;P.x+=dx/l*130;P.y+=dy/l*130;P.inv=.4;P.dash=.75;part(P.x,P.y,C.purple,22)}
function astra(){if(!running||P.astra>0)return;P.astra=3;for(let i=0;i<14;i++){let a=i*6.28/14;shots.push({x:P.x,y:P.y,vx:Math.cos(a)*310,vy:Math.sin(a)*310,r:7,l:1.5,d:P.astraDmg})}part(P.x,P.y,C.purple,35)}
function enemyFire(e){let dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;enemyShots.push({x:e.x,y:e.y,vx:dx/l*185,vy:dy/l*185,r:6,l:4,d:10+realmN*2})}
function nextRealm(){if(realmN>=4){running=false;winText.textContent=`You crossed the four realms and restored balance with ${Math.floor(dharma)} Dharma.`;show("win");return}running=false;showBoons()}
function showBoons(){let all=[["Astra Vidya","Astras deal +15 damage",()=>P.astraDmg+=15],["Vayu's Grace","+40 movement speed",()=>P.spd+=40],["Amrita","Restore Prana and gain +20 max",()=>{P.max+=20;P.hp=P.max}],["Vajra Edge","+12 attack damage",()=>P.dmg+=12],["Surya's Sight","+10% critical chance",()=>P.crit+=.10],["Kavacha","Take less damage",()=>P.inv+=.12]];all.sort(()=>Math.random()-.5);choices.innerHTML="";all.slice(0,3).forEach(b=>{let z=document.createElement("button");z.className="boon";z.innerHTML=`<b>${b[0]}</b>${b[1]}<div class="small">Tap to receive</div>`;z.onclick=()=>{b[2]();realmN++;build();hide();running=true;last=performance.now();raf=requestAnimationFrame(loop);hud()};choices.appendChild(z)});show("boonPanel")}
function update(dt){P.inv=Math.max(0,P.inv-dt);P.attack=Math.max(0,P.attack-dt);P.dash=Math.max(0,P.dash-dt);P.astra=Math.max(0,P.astra-dt);let dx=0,dy=0;if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;if(keys.w||keys.ArrowUp)dy--;if(keys.s||keys.ArrowDown)dy++;if(joy.on){dx=joy.x;dy=joy.y}let l=Math.hypot(dx,dy);if(l>.08){dx/=l;dy/=l;P.x+=dx*P.spd*dt;P.y+=dy*P.spd*dt;aim.x=dx;aim.y=dy}P.x=Math.max(30,Math.min(W-30,P.x));P.y=Math.max(70,Math.min(H-85,P.y));
for(let e of en){let ax=P.x-e.x,ay=P.y-e.y,d=Math.hypot(ax,ay)||1;if(d>e.r+P.r+7){e.x+=ax/d*e.spd*dt;e.y+=ay/d*e.spd*dt}e.fire-=dt;if(e.fire<=0&&e.t!=="asura"){e.fire=1.4+Math.random()*2;enemyFire(e)}if(d<e.r+P.r)hurt(e.t==="asura"?18:11)}
for(let i=shots.length-1;i>=0;i--){let q=shots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0){shots.splice(i,1);continue}for(let j=en.length-1;j>=0;j--){let e=en[j];if(Math.hypot(q.x-e.x,q.y-e.y)<q.r+e.r){e.hp-=q.d;part(e.x,e.y,C.purple,5);q.l=0;if(e.hp<=0){score+=25;dharma+=7;part(e.x,e.y,C.red,15);en.splice(j,1)}break}}}
for(let i=enemyShots.length-1;i>=0;i--){let q=enemyShots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0){enemyShots.splice(i,1);continue}if(Math.hypot(q.x-P.x,q.y-P.y)<q.r+P.r){enemyShots.splice(i,1);hurt(q.d)}}
for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt}parts=parts.filter(p=>p.l>0);
if(!en.length)exit.open=true;if(exit.open&&Math.hypot(P.x-exit.x,P.y-exit.y)<38)nextRealm();score+=dt*5;hud()}
function draw(){g.setTransform(D,0,0,D,0,0);g.fillStyle=C.bg;g.fillRect(0,0,W,H);
g.fillStyle=realmN===1?"#1b0d0b":realmN===2?"#0e1b11":realmN===3?"#190c16":"#171226";g.fillRect(14,52,W-28,H-105);
for(let i=0;i<36;i++){let xx=22+(i%6)*58,yy=65+Math.floor(i/6)*43;g.fillStyle=i%2?"#20150f":"#261910";if(realmN===2)g.fillStyle=i%2?"#132116":"#17281a";if(realmN===3)g.fillStyle=i%2?"#211124":"#28152a";g.fillRect(xx,yy,54,40)}
g.strokeStyle="#62452c";g.lineWidth=2;g.strokeRect(14,52,W-28,H-105);
if(exit){g.beginPath();g.arc(exit.x,exit.y,22,0,6.28);g.strokeStyle=exit.open?C.gold:"#4c3a30";g.lineWidth=4;g.stroke()}
for(const e of en){g.fillStyle=e.t==="asura"?"#6e2730":e.t==="yaksha"?"#3e356b":"#713027";g.beginPath();g.arc(e.x,e.y,e.r,0,6.28);g.fill();g.strokeStyle=e.t==="yaksha"?C.purple:C.red;g.lineWidth=2;g.stroke();g.fillStyle=C.white;g.fillRect(e.x-7,e.y-5,4,4);g.fillRect(e.x+3,e.y-5,4,4);g.fillStyle="#211016";g.fillRect(e.x-7,e.y+7,14,3);g.fillStyle="#28181a";g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);g.fillStyle=C.red;g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.max),3)}
for(const q of shots){g.fillStyle=C.purple;g.shadowColor=C.purple;g.shadowBlur=10;g.beginPath();g.arc(q.x,q.y,q.r,0,6.28);g.fill();g.shadowBlur=0}
for(const q of enemyShots){g.fillStyle=C.orange;g.shadowColor=C.orange;g.shadowBlur=7;g.beginPath();g.arc(q.x,q.y,q.r,0,6.28);g.fill();g.shadowBlur=0}
for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,3,0,6.28);g.fill()}g.globalAlpha=1;
if(P.inv<=0||Math.floor(P.inv*18)%2===0){g.save();g.translate(P.x,P.y);g.rotate(Math.atan2(aim.y,aim.x));g.fillStyle="#4a2930";g.strokeStyle=C.hero;g.lineWidth=3;g.beginPath();g.moveTo(31,0);g.lineTo(-15,-15);g.lineTo(-8,0);g.lineTo(-15,15);g.closePath();g.fill();g.stroke();g.fillStyle=C.gold;g.fillRect(0,-5,13,10);g.fillStyle=C.white;g.fillRect(8,-2,6,4);if(P.attack>0){g.strokeStyle=C.gold;g.lineWidth=5;g.beginPath();g.arc(0,0,52,-.7,.7);g.stroke()}g.restore()}}
function loop(t){if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function stickMove(e){let r=stickEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`;if(Math.hypot(joy.x,joy.y)>.2){aim.x=joy.x;aim.y=joy.y}}
const stickEl=document.getElementById("stick"),knob=document.getElementById("knob");stickEl.onpointerdown=e=>{joy.on=true;stickEl.setPointerCapture(e.pointerId);stickMove(e)};stickEl.onpointermove=e=>{if(joy.on)stickMove(e)};stickEl.onpointerup=stickEl.onpointercancel=()=>{joy.on=false;knob.style.transform="translate(0,0)"};
attack.onclick=attack;dash.onclick=dash;astra.onclick=astra;start.onclick=start;retry.onclick=start;again.onclick=start;
addEventListener("keydown",e=>{keys[e.key]=1;if(e.key===" ")attack();if(e.key==="Shift")dash();if(e.key.toLowerCase()==="q")astra()});addEventListener("keyup",e=>keys[e.key]=0);
hud();draw();
})();
</script></body></html>
