<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Space Dodger V1.4</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#59caff;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
body{touch-action:none}
#app{position:absolute;inset:0;background:#000;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:#000;image-rendering:pixelated;touch-action:none}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,170,255,.025) 0,rgba(0,170,255,.025) 1px,transparent 1px,transparent 3px);z-index:2}
.controls{position:absolute;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 18px;z-index:4;pointer-events:none}
button{pointer-events:auto;min-width:100px;min-height:48px;border:1px solid #087ca8;border-radius:10px;background:rgba(0,18,27,.78);color:#55ccff;font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em}
button:active{background:#06384b;transform:scale(.97)}
.overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.91);padding:24px}
.panel{width:min(92vw,430px)}
h1{font-size:clamp(24px,7vw,38px);letter-spacing:.12em;color:#00aaff;margin:0 0 14px;text-shadow:0 0 10px rgba(0,170,255,.45)}
p{font-size:12px;line-height:1.7;color:#7edaff;margin:6px 0}
.panel button{margin-top:14px;min-width:220px}
.diag{position:absolute;left:50%;bottom:82px;transform:translateX(-50%);z-index:4;text-align:center;font-size:10px;color:#3d91ad;white-space:nowrap;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:5px;pointer-events:none}
.diag b{color:#7edaff}
</style>
</head>
<body>
<div id="app">
<canvas id="game" width="256" height="128" aria-label="Space Dodger"></canvas>
<div class="scan"></div>

<div class="diag">TILT <b id="motion">NO</b> &nbsp; X:<b id="gamma">--</b> &nbsp; Y:<b id="beta">--</b></div>

<div class="controls">
<button id="left">◀ LEFT</button>
<button id="right">RIGHT ▶</button>
</div>

<div class="overlay" id="overlay">
<div class="panel">
<h1 id="title">SPACE DODGER</h1>
<p id="message">ESP32 OLED EDITION</p>
<p>FULL SCREEN • BLUE MONOCHROME</p>
<p>TILT YOUR iPHONE TO STEER</p>
<button id="enable">ENABLE TILT</button>
<button id="play">START GAME</button>
</div>
</div>
</div>

<script>
(()=>{"use strict";
const c=document.getElementById("game"),ctx=c.getContext("2d"),W=256,H=128;
const overlay=document.getElementById("overlay"),title=document.getElementById("title"),message=document.getElementById("message");
const enable=document.getElementById("enable"),play=document.getElementById("play"),calibrate=document.getElementById("calibrate");
const motionEl=document.getElementById("motion"),gammaEl=document.getElementById("gamma"),betaEl=document.getElementById("beta");
const leftBtn=document.getElementById("left"),rightBtn=document.getElementById("right");
let best=Number(localStorage.getItem("sdBest")||0),score=0,level=1,timeAlive=0;
let running=false,last=0,raf=0,spawnTimer=0,hitFlash=0;
let motionEnabled=false,motionSeen=false,calibrated=false,neutral=0,gamma=0,beta=0,permissionBusy=false;
let player={x:128,y:113,speed:105,inv:0};
let rocks=[],particles=[],stars=[],left=false,right=false,drag=false;

function initStars(){stars=Array.from({length:48},()=>({x:Math.random()*W,y:Math.random()*H,v:5+Math.random()*18,s:Math.random()<.8?1:2}))}
function hud(){
 ctx.fillStyle="#00aaff";ctx.font="6px monospace";ctx.textBaseline="top";
 ctx.fillText("SCORE:"+String(Math.floor(score)).padStart(4,"0"),4,3);
 ctx.fillText("HI:"+String(Math.floor(best)).padStart(4,"0"),100,3);
 ctx.fillText("LV:"+String(level).padStart(2,"0"),224,3);
}
function reset(){score=0;level=1;timeAlive=0;spawnTimer=0;hitFlash=0;rocks=[];particles=[];player.x=W/2;player.inv=1.4;initStars();draw()}
function onOrientation(e){
 if(typeof e.gamma==="number"&&Number.isFinite(e.gamma)){
  gamma=e.gamma;gammaEl.textContent=gamma.toFixed(1)+"°";motionSeen=true;motionEl.textContent="YES";
 }
 if(typeof e.beta==="number"&&Number.isFinite(e.beta)){beta=e.beta;betaEl.textContent=beta.toFixed(1)+"°"}
}
async function enableMotion(){
 if(permissionBusy)return;permissionBusy=true;
 try{
  if(typeof DeviceOrientationEvent==="undefined"){enable.textContent="TILT UNAVAILABLE";permissionBusy=false;return}
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
   const result=await DeviceOrientationEvent.requestPermission();
   if(result!=="granted"){enable.textContent="TILT DENIED";permissionBusy=false;return}
  }
  window.addEventListener("deviceorientation",onOrientation,true);
  motionEnabled=true;enable.textContent="TILT ENABLED";enable.disabled=true;
 }catch(e){enable.textContent="TILT FAILED"}
 permissionBusy=false;
}
function calibrateTilt(){
 if(motionSeen){neutral=gamma;calibrated=true}
}
function startGame(){
 reset();running=true;overlay.style.display="none";last=performance.now();raf=requestAnimationFrame(loop);
 if(motionEnabled&&!calibrated)setTimeout(calibrateTilt,500);
}
function spawn(){
 const r=4+Math.random()*6+Math.min(4,level*.22);
 rocks.push({x:r+Math.random()*(W-r*2),y:-r-2,r,v:24+level*3.1+Math.random()*18,rot:Math.random()*6.28,spin:(Math.random()-.5)*2.5,kind:Math.random()});
}
function explode(x,y){
 for(let i=0;i<12;i++){const a=Math.random()*6.283,v=16+Math.random()*45;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:.35+Math.random()*.45})}
}
function update(dt){
 timeAlive+=dt;score+=dt*10;level=1+Math.floor(timeAlive/15);if(player.inv>0)player.inv-=dt;
 let dir=0;if(left)dir--;if(right)dir++;
 if(motionEnabled&&motionSeen&&calibrated){
  const d=gamma-neutral,dead=3;
  if(Math.abs(d)>dead)dir=Math.sign(d)*Math.min(1,(Math.abs(d)-dead)/22);
 }
 player.x=Math.max(7,Math.min(W-7,player.x+dir*player.speed*dt));
 for(const s of stars){s.y+=s.v*dt*(1+level*.04);if(s.y>H){s.y=0;s.x=Math.random()*W}}
 spawnTimer+=dt;const interval=Math.max(.18,.72-level*.025);if(spawnTimer>=interval){spawnTimer=0;spawn()}
 for(let i=rocks.length-1;i>=0;i--){
  const r=rocks[i];r.y+=r.v*dt;r.rot+=r.spin*dt;
  if(r.y>H+r.r){rocks.splice(i,1);continue}
  if(player.inv<=0&&Math.hypot(player.x-r.x,player.y-r.y)<r.r+5){
   explode(player.x,player.y);player.inv=1.1;hitFlash=.18;score=Math.max(0,score-20);rocks.splice(i,1);
   if(navigator.vibrate)navigator.vibrate(70)
  }
 }
 for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=15*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
 if(hitFlash>0)hitFlash-=dt;
 if(score>best){best=Math.floor(score);try{localStorage.setItem("sdBest",best)}catch(e){}}
}
function ship(){
 ctx.fillStyle="#00aaff";
 ctx.fillRect(Math.round(player.x),player.y-5,1,8);
 ctx.fillRect(Math.round(player.x)-1,player.y-3,3,7);
 ctx.fillRect(Math.round(player.x)-2,player.y-1,5,5);
 ctx.fillRect(Math.round(player.x)-4,player.y+2,3,2);
 ctx.fillRect(Math.round(player.x)+2,player.y+2,3,2);
 if(Math.random()<.65)ctx.fillRect(Math.round(player.x)-1,player.y+5,1,2);
 if(Math.random()<.65)ctx.fillRect(Math.round(player.x),player.y+5,1,2);
}
function asteroid(r){
 ctx.save();ctx.translate(Math.round(r.x),Math.round(r.y));ctx.rotate(r.rot);ctx.strokeStyle="#00aaff";ctx.lineWidth=1;ctx.beginPath();
 for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=r.r*(.72+((i*13)%7)/15),x=Math.round(Math.cos(a)*rr),y=Math.round(Math.sin(a)*rr);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
 ctx.closePath();ctx.stroke();ctx.fillStyle="#00aaff";ctx.fillRect(-1,-1,2,2);ctx.restore();
}
function draw(){
 ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);ctx.fillStyle="#00aaff";
 for(const s of stars)ctx.fillRect(Math.round(s.x),Math.round(s.y),s.s,s.s);
 for(const r of rocks)asteroid(r);
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle="#00aaff";ctx.fillRect(Math.round(p.x),Math.round(p.y),1,1)}ctx.globalAlpha=1;
 if(!running||player.inv<=0||Math.floor(player.inv*12)%2===0)ship();
 hud();
 if(hitFlash>0){ctx.fillStyle="#00aaff";ctx.globalAlpha=.16;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
}
function loop(t){if(!running)return;const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function moveTouch(e){const r=c.getBoundingClientRect();player.x=Math.max(7,Math.min(W-7,((e.clientX-r.left)/r.width)*W))}
c.addEventListener("pointerdown",e=>{if(!running)return;drag=true;moveTouch(e);c.setPointerCapture?.(e.pointerId)});
c.addEventListener("pointermove",e=>{if(drag)moveTouch(e)});
c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);
function hold(btn,which){
 btn.addEventListener("pointerdown",e=>{e.preventDefault();if(which==="l")left=true;else right=true});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>btn.addEventListener(ev,()=>{if(which==="l")left=false;else right=false}));
}
hold(leftBtn,"l");hold(rightBtn,"r");
enable.addEventListener("click",enableMotion);
play.addEventListener("click",()=>{if(motionEnabled&&!calibrated)calibrateTilt();startGame()});
window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=true;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=true});
window.addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")left=false;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")right=false});
initStars();draw();
})();
</script>
</body>
</html>
