<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flappy Bird - Hand Drawn</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    overflow: hidden; background: #f4ead5;
    font-family: Georgia, "Times New Roman", serif;
    touch-action: none;
  }
  body { display:flex; justify-content:center; align-items:center; }
  #gameWrap {
    position:relative; width:min(100vw, 520px); height:100dvh;
    max-height:900px; overflow:hidden; background:#bfe5e0;
    box-shadow:0 0 30px rgba(40,40,30,.18);
  }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #hud {
    position:absolute; top:calc(env(safe-area-inset-top) + 18px); left:0; right:0;
    text-align:center; pointer-events:none; z-index:2;
    color:#3c382f; font-size:34px; font-weight:bold;
    text-shadow:2px 2px 0 #f7efd9, -1px -1px 0 #f7efd9;
  }
  #message {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; pointer-events:none; z-index:3;
  }
  .card {
    padding:22px 25px; max-width:82%;
    background:rgba(250,244,222,.93);
    border:3px solid #514b3d; border-radius:18px;
    box-shadow:5px 6px 0 rgba(65,59,48,.22);
    color:#3c382f;
  }
  .title { font-size:34px; font-weight:bold; margin-bottom:8px; }
  .sub { font-size:18px; line-height:1.45; }
  #restart {
    display:none; margin-top:15px; padding:11px 22px;
    border:2px solid #514b3d; border-radius:12px;
    background:#f1d16a; color:#3c382f; font:700 17px Georgia,serif;
    pointer-events:auto; touch-action:manipulation;
  }
  #hint {
    position:absolute; bottom:calc(env(safe-area-inset-bottom) + 12px); left:0; right:0;
    text-align:center; color:rgba(60,56,47,.7); font-size:14px; pointer-events:none;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>
  <div id="hud">0</div>
  <div id="message">
    <div class="card">
      <div class="title" id="title">FLAPPY</div>
      <div class="sub" id="sub">A hand-drawn little adventure<br><br>Tap anywhere to fly</div>
      <button id="restart">PLAY AGAIN</button>
    </div>
  </div>
  <div id="hint">Tap anywhere • Avoid the pipes</div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const hud = document.getElementById("hud");
  const message = document.getElementById("message");
  const title = document.getElementById("title");
  const sub = document.getElementById("sub");
  const restart = document.getElementById("restart");
  const hint = document.getElementById("hint");

  let W = 400, H = 700, dpr = 1;
  let state = "ready";
  let score = 0;
  let best = Number(localStorage.getItem("flappyBest") || 0);
  let last = 0, spawnTimer = 0;
  let pipes = [];
  let bird;
  let clouds = [];
  let groundOffset = 0;

  const COLORS = {
    ink: "#514b3d",
    paper: "#f8efd5",
    sky: "#bfe5e0",
    sky2: "#dcebd4",
    grass: "#71985a",
    pipe: "#729d62",
    pipeLight: "#91b579",
    pipeDark: "#52794c",
    beak: "#d88b45",
    yellow: "#e6c454",
    wing: "#c89f3e"
  };

  function resize() {
    const rect = canvas.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(280, rect.width);
    H = Math.max(480, rect.height);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function rand(a,b) { return a + Math.random() * (b-a); }

  function roughLine(points, width=2, alpha=1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i=1;i<points.length;i++) {
      const [x,y] = points[i];
      ctx.lineTo(x + rand(-1.2,1.2), y + rand(-1.2,1.2));
    }
    ctx.stroke();
    ctx.restore();
  }

  function sketchRect(x,y,w,h,fill) {
    ctx.save();
    ctx.fillStyle = fill;
    ctx.fillRect(x,y,w,h);
    roughLine([[x,y],[x+w,y+rand(-1,1)],[x+w,y+h],[x,y+h],[x,y]],2);
    roughLine([[x+2,y+3],[x+w-2,y+2],[x+w-2,y+h-2],[x+2,y+h-2],[x+2,y+3]],1,0.55);
    ctx.restore();
  }

  function makeClouds() {
    clouds = [];
    for (let i=0;i<7;i++) {
      clouds.push({x:rand(-40,W), y:rand(70,H*.42), s:rand(.65,1.3), speed:rand(5,12)});
    }
  }

  function reset() {
    resize();
    score = 0;
    pipes = [];
    spawnTimer = 0;
    state = "ready";
    bird = {x:W*.28, y:H*.43, vy:0, r:16, rot:0, wing:0};
    makeClouds();
    hud.textContent = "0";
    title.textContent = "FLAPPY";
    sub.innerHTML = "A hand-drawn little adventure<br><br>Tap anywhere to fly";
    restart.style.display = "none";
    message.style.display = "flex";
    hint.style.display = "block";
  }

  function begin() {
    if (state === "ready") {
      state = "playing";
      message.style.display = "none";
      hint.style.display = "block";
    } else if (state === "dead") {
      reset();
      state = "playing";
      message.style.display = "none";
    }
    bird.vy = -390;
  }

  function gameOver() {
    if (state !== "playing") return;
    state = "dead";
    best = Math.max(best, score);
    try { localStorage.setItem("flappyBest", String(best)); } catch(e) {}
    title.textContent = "OH NO!";
    sub.innerHTML = "Score: <b>" + score + "</b><br>Best: <b>" + best + "</b>";
    restart.style.display = "inline-block";
    message.style.display = "flex";
    hint.style.display = "none";
  }

  function addPipe() {
    const ground = 62;
    const gap = Math.max(135, Math.min(175, H*.22));
    const minTop = 70;
    const maxTop = H-ground-gap-75;
    pipes.push({
      x: W+30,
      top: rand(minTop, Math.max(minTop+20,maxTop)),
      gap,
      passed:false
    });
  }

  function update(dt) {
    if (state !== "playing") {
      if (state === "ready") {
        bird.y = H*.43 + Math.sin(performance.now()/220)*5;
        bird.wing = Math.sin(performance.now()/100);
      }
      return;
    }

    bird.vy += 1100*dt;
    bird.y += bird.vy*dt;
    bird.rot = Math.max(-.45, Math.min(1.15, bird.vy/500));
    bird.wing = Math.sin(performance.now()/80);

    spawnTimer += dt;
    if (spawnTimer > 1.55) {
      spawnTimer = 0;
      addPipe();
    }

    const speed = 155;
    for (const p of pipes) {
      p.x -= speed*dt;
      if (!p.passed && p.x+p.pipeWidth < bird.x) {
        p.passed = true;
        score++;
        hud.textContent = String(score);
      }
    }
    pipes = pipes.filter(p => p.x + 80 > -20);

    const groundY = H-62;
    if (bird.y+bird.r > groundY || bird.y-bird.r < 0) gameOver();

    for (const p of pipes) {
      const pw = 68;
      const hitX = bird.x+bird.r > p.x && bird.x-bird.r < p.x+pw;
      const hitY = bird.y-bird.r < p.top || bird.y+bird.r > p.top+p.gap;
      if (hitX && hitY) { gameOver(); break; }
    }

    groundOffset = (groundOffset + speed*dt) % 32;
    for (const c of clouds) {
      c.x -= c.speed*dt;
      if (c.x < -90*c.s) c.x = W+40;
    }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,COLORS.sky);
    g.addColorStop(1,COLORS.sky2);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    for (const c of clouds) {
      ctx.save();
      ctx.translate(c.x,c.y);
      ctx.scale(c.s,c.s);
      ctx.fillStyle = "rgba(250,247,224,.72)";
      ctx.beginPath();
      ctx.arc(0,8,18,0,Math.PI*2);
      ctx.arc(20,0,23,0,Math.PI*2);
      ctx.arc(44,10,16,0,Math.PI*2);
      ctx.fill();
      roughLine([[-20,18],[2,21],[23,20],[47,18]],1.5,.45);
      ctx.restore();
    }

    // Distant hand-drawn hills
    ctx.fillStyle = "#a7c08c";
    ctx.beginPath();
    ctx.moveTo(0,H-105);
    for(let x=0;x<=W;x+=35) ctx.quadraticCurveTo(x+17,H-145-rand(0,18),x+35,H-105);
    ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  }

  function drawPipe(p) {
    const x=p.x, w=68;
    const bottomY=H-62;
    sketchRect(x,0,w,p.top,COLORS.pipe);
    sketchRect(x,p.top+p.gap,w,bottomY-(p.top+p.gap),COLORS.pipe);

    // Pipe caps
    sketchRect(x-5,p.top-22,w+10,22,COLORS.pipeLight);
    sketchRect(x-5,p.top+p.gap,w+10,22,COLORS.pipeLight);

    // Hand shading
    ctx.save();
    ctx.globalAlpha=.45;
    ctx.fillStyle=COLORS.pipeLight;
    ctx.fillRect(x+9,0,9,p.top);
    ctx.fillRect(x+9,p.top+p.gap,9,bottomY-(p.top+p.gap));
    ctx.restore();

    roughLine([[x+3,p.top+5],[x+w-3,p.top+4]],1,.6);
    roughLine([[x+3,p.top+p.gap+5],[x+w-3,p.top+p.gap+4]],1,.6);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(bird.rot);

    // loose shadow/outline
    ctx.fillStyle=COLORS.yellow;
    ctx.beginPath();
    ctx.ellipse(0,0,17,15,0,0,Math.PI*2);
    ctx.fill();
    roughLine([[-15,0],[-11,-11],[1,-16],[13,-10],[17,0],[13,11],[0,16],[-14,10],[-15,0]],2.5);

    // wing
    const wingY=5+bird.wing*2;
    ctx.fillStyle=COLORS.wing;
    ctx.beginPath();
    ctx.ellipse(-5,wingY,10,6,-.25,0,Math.PI*2);
    ctx.fill();
    roughLine([[-14,5],[-8,2],[4,5],[-5,11],[-14,5]],1.7);

    // eye
    ctx.fillStyle="#fffdf0";
    ctx.beginPath();ctx.arc(7,-6,6.5,0,Math.PI*2);ctx.fill();
    roughLine([[2,-8],[8,-12],[13,-7],[12,-2],[6,0],[2,-8]],1.5);
    ctx.fillStyle=COLORS.ink;
    ctx.beginPath();ctx.arc(9,-6,2.4,0,Math.PI*2);ctx.fill();

    // beak
    ctx.fillStyle=COLORS.beak;
    ctx.beginPath();ctx.moveTo(13,-1);ctx.lineTo(27,3);ctx.lineTo(13,8);ctx.closePath();ctx.fill();
    roughLine([[13,-1],[27,3],[13,8]],1.8);

    ctx.restore();
  }

  function drawGround() {
    const y=H-62;
    ctx.fillStyle=COLORS.grass;
    ctx.fillRect(0,y,W,10);
    roughLine([[0,y+2],[32,y-1],[64,y+2],[96,y-1],[128,y+2],[160,y-1],[192,y+2],[224,y-1],[256,y+2],[288,y-1],[320,y+2],[352,y-1],[W,y+2]],2.5);

    ctx.fillStyle=COLORS.paper;
    ctx.fillRect(0,y+10,W,52);
    for(let x=-32-(groundOffset%32);x<W+32;x+=32) {
      roughLine([[x,y+12],[x+17,y+25],[x+5,y+38],[x+27,y+55]],1.3,.45);
    }
    roughLine([[0,y+61],[W,y+61]],2);
  }

  function draw() {
    ctx.clearRect(0,0,W,H);
    drawSky();
    for(const p of pipes) drawPipe(p);
    drawGround();
    drawBird();
  }

  function loop(t) {
    const dt = Math.min((t-last)/1000 || 0, .033);
    last=t;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    begin();
  }, {passive:false});

  restart.addEventListener("pointerdown", e => {
    e.stopPropagation();
    reset();
  }, {passive:false});

  window.addEventListener("resize", resize);
  document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      begin();
    }
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
