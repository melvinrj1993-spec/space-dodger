<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Underworld Escape</title><style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#08070b;color:#fff;font-family:system-ui}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.hud{position:fixed;z-index:2;top:env(safe-area-inset-top);left:0;right:0;padding:14px;display:flex;justify-content:space-between;font-weight:700;font-size:13px}.hp{color:#ff5864}.gold{color:#ffd34e}.room{color:#c6aaff}.btn{position:fixed;z-index:3;border:1px solid #8f78ad;background:#17121d;color:white;border-radius:50%;width:64px;height:64px;font-size:24px}.atk{right:22px;bottom:25px}.dash{right:100px;bottom:92px}.spec{right:100px;bottom:20px;font-size:15px}.stick{position:fixed;z-index:3;left:22px;bottom:25px;width:130px;height:130px;border-radius:50%;border:1px solid #5b5068;background:#17121d66}.knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#b9a5d455;border:1px solid #cbbbe0}.overlay{position:fixed;z-index:10;inset:0;background:#07060aee;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px}.panel{width:min(92vw,500px)}h1{font:700 clamp(38px,12vw,72px) Georgia;color:#e8c96c;text-shadow:0 4px #55263b;margin:0 0 12px}h2{font:700 30px Georgia;color:#e8c96c}p{color:#c8c0cc;line-height:1.5}.action,.boon{width:240px;margin:9px auto;padding:14px;border:1px solid #a68148;border-radius:9px;background:#241a27;color:#f0d487;font-weight:700}.boon{width:100%;text-align:left;border-color:#725b83}.boon b{display:block;color:#e8c96c;margin-bottom:4px}
</style></head><body><canvas id="c"></canvas><div class="hud"><span class="hp" id="hp"></span><span class="room" id="room"></span><span class="gold" id="gold"></span></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="btn atk" id="atk">⚔</button><button class="btn dash" id="dash">✦</button><button class="btn spec" id="spec">SPECIAL</button><div class="overlay" id="ov"><div class="panel" id="menu"><h1>UNDERWORLD:<br>ESCAPE</h1><p>Original mythic action roguelite. Fight through dangerous chambers, dash through attacks, and choose powerful boons.</p><button class="action" id="start">BEGIN ESCAPE</button></div><div class="panel" id="boons" style="display:none"><h2>CHOOSE A BOON</h2><p>Choose one upgrade for your run.</p><div id="choices"></div></div><div class="panel" id="dead" style="display:none"><h1>FALLEN</h1><p id="deadtxt"></p><button class="action" id="retry">TRY AGAIN</button></div><div class="panel" id="win" style="display:none"><h1>ESCAPED</h1><p>You broke through the underworld.</p><button class="action" id="winretry">RUN AGAIN</button></div></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let W,H,D=1;function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
let run=0,room=1,score=0,gold=0,last=0,raf,en=[],shots=[],ps=[],parts=[],exit,shake=0;
let P={x:0,y:0,r:18,hp:100,max:100,spd:230,dmg:28,inv:0,cd:0,dash:0,special:0,crit:.05},keys={},joy={on:false,x:0,y:0},aim={x:1,y:0};
const C={gold:'#e8c96c',red:'#ff5361',purple:'#a878ff',hero:'#d9ccff',bg:'#09070d'};
function hud(){hp.textContent=`HP ${Math.ceil(P.hp)}/${P.max}`;roomEl.textContent=`ROOM ${room}`;goldEl.textContent=`OBOLS ${gold}`}const hp=document.getElementById('hp'),roomEl=document.getElementById('room'),goldEl=document.getElementById('gold');
function particles(a,b,col,n=10){for(let i=0;i<n;i++){let q=Math.random()*6.28,v=30+Math.random()*150;parts.push({x:a,y:b,vx:Math.cos(q)*v,vy:Math.sin(q)*v,l:.25+Math.random()*.5,m:.7,col})}}
function build(){en=[];shots=[];ps=[];exit={x:W/2,y:70,open:false};for(let i=0;i<3+room*2;i++){let t=Math.random();en.push({t:t<.5?'skull':t<.82?'brute':'caster',x:60+Math.random()*(W-120),y:110+Math.random()*(H-250),r:t<.5?18:t<.82?27:21,hp:(t<.5?38:t<.82?78:50)+room*8,max:0,spd:t<.5?65:t<.82?38:45,fire:1+Math.random()*2});en.at(-1).max=en.at(-1).hp}}
function start(){room=1;score=gold=0;P.max=100;P.hp=100;P.spd=230;P.dmg=28;P.crit=.05;P.x=W/2;P.y=H-145;build();hide();run=1;last=performance.now();raf=requestAnimationFrame(loop);hud()}
function hide(){ov.style.display='none'}function show(id){for(let q of ['menu','boons','dead','win'])document.getElementById(q).style.display='none';document.getElementById(id).style.display='block';ov.style.display='flex'}
function hurt(n){if(P.inv>0)return;P.hp-=n;P.inv=.65;shake=.2;particles(P.x,P.y,C.red,20);if(navigator.vibrate)navigator.vibrate(35);if(P.hp<=0){run=0;deadtxt.textContent=`You reached chamber ${room} with ${Math.floor(score)} points.`;show('dead')}}
function attack(){if(!run||P.cd>0)return;P.cd=.28;particles(P.x+aim.x*25,P.y+aim.y*25,C.gold,7);for(let i=en.length-1;i>=0;i--){let e=en[i],dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<P.r+e.r+55&&(dx/d)*aim.x+(dy/d)*aim.y>.1){e.hp-=P.dmg*(Math.random()<P.crit?2:1);e.hit=.1;particles(e.x,e.y,C.red,7);if(e.hp<=0){score+=e.t==='brute'?50:25;gold+=3+Math.floor(Math.random()*6);particles(e.x,e.y,C.red,18);en.splice(i,1)}}}}
function dash(){if(!run||P.dash>0)return;let dx=aim.x,dy=aim.y,l=Math.hypot(dx,dy)||1;if(keys.a||keys.ArrowLeft)dx=-1;if(keys.d||keys.ArrowRight)dx=1;if(keys.w||keys.ArrowUp)dy=-1;if(keys.s||keys.ArrowDown)dy=1;if(joy.on){dx=joy.x;dy=joy.y}l=Math.hypot(dx,dy)||1;P.x+=dx/l*125;P.y+=dy/l*125;P.inv=.4;P.dash=.8;particles(P.x,P.y,C.purple,22)}
function special(){if(!run||P.special>0)return;P.special=3;for(let i=0;i<14;i++){let a=i*6.28/14;shots.push({x:P.x,y:P.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,r:6,l:1.5,d:25})}particles(P.x,P.y,C.purple,35)}
function enemyFire(e){let dx=P.x-e.x,dy=P.y-e.y,l=Math.hypot(dx,dy)||1;ps.push({x:e.x,y:e.y,vx:dx/l*190,vy:dy/l*190,r:6,l:4,d:10+room})}
function next(){if(room>=6){run=0;show('win');return}run=0;let all=[['Blood Edge','+12 attack damage',()=>P.dmg+=12],['Swift Sand','+35 speed',()=>P.spd+=35],['Moonheart','+20 max HP and heal',()=>{P.max+=20;P.hp=P.max}],['Shadow Step','Dash cooldown reduced',()=>P.dash=Math.max(0,P.dash-.25)],['Oracle Eye','+8% critical chance',()=>P.crit+=.08],['Void Shard','Special damage +15',()=>shots.forEach(q=>q.d+=15)]];all.sort(()=>Math.random()-.5);choices.innerHTML='';all.slice(0,3).forEach(b=>{let z=document.createElement('button');z.className='boon';z.innerHTML='<b>'+b[0]+'</b>'+b[1];z.onclick=()=>{b[2]();room++;build();hide();run=1;last=performance.now();raf=requestAnimationFrame(loop);hud()};choices.appendChild(z)});show('boons')}
function update(dt){P.inv=Math.max(0,P.inv-dt);P.cd=Math.max(0,P.cd-dt);P.dash=Math.max(0,P.dash-dt);P.special=Math.max(0,P.special-dt);let dx=0,dy=0;if(keys.a||keys.ArrowLeft)dx--;if(keys.d||keys.ArrowRight)dx++;if(keys.w||keys.ArrowUp)dy--;if(keys.s||keys.ArrowDown)dy++;if(joy.on){dx=joy.x;dy=joy.y}let l=Math.hypot(dx,dy);if(l>.08){dx/=l;dy/=l;P.x+=dx*P.spd*dt;P.y+=dy*P.spd*dt;aim.x=dx;aim.y=dy}P.x=Math.max(30,Math.min(W-30,P.x));P.y=Math.max(70,Math.min(H-85,P.y));for(let e of en){let ax=P.x-e.x,ay=P.y-e.y,d=Math.hypot(ax,ay)||1;if(d>e.r+P.r+5){e.x+=ax/d*e.spd*dt;e.y+=ay/d*e.spd*dt}e.fire-=dt;if(e.fire<=0&&e.t!=='brute'){e.fire=1.5+Math.random()*2;enemyFire(e)}if(d<e.r+P.r)hurt(e.t==='brute'?18:10)}
for(let i=shots.length-1;i>=0;i--){let q=shots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0){shots.splice(i,1);continue}for(let j=en.length-1;j>=0;j--){let e=en[j];if(Math.hypot(q.x-e.x,q.y-e.y)<q.r+e.r){e.hp-=q.d;particles(e.x,e.y,C.purple,5);q.l=0;if(e.hp<=0){score+=25;gold+=3;particles(e.x,e.y,C.red,15);en.splice(j,1)}break}}}
for(let i=ps.length-1;i>=0;i--){let q=ps[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0){ps.splice(i,1);continue}if(Math.hypot(q.x-P.x,q.y-P.y)<q.r+P.r){ps.splice(i,1);hurt(q.d)}}
for(let p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.l-=dt}parts=parts.filter(p=>p.l>0);if(!en.length)exit.open=true;if(exit.open&&Math.hypot(P.x-exit.x,P.y-exit.y)<35)next();score+=dt*5;hud()}
function draw(){x.setTransform(D,0,0,D,0,0);x.fillStyle=C.bg;x.fillRect(0,0,W,H);x.fillStyle='#16111c';x.fillRect(14,52,W-28,H-105);x.strokeStyle='#4b3c55';x.lineWidth=2;x.strokeRect(14,52,W-28,H-105);for(let i=0;i<30;i++){x.fillStyle=i%2?'#1b1520':'#211a26';x.fillRect(25+(i%6)*55,65+Math.floor(i/6)*45,52,42)}if(exit){x.beginPath();x.arc(exit.x,exit.y,22,0,6.28);x.strokeStyle=exit.open?C.gold:'#4a4050';x.lineWidth=4;x.stroke()}for(let e of en){x.fillStyle=e.t==='brute'?'#673247':e.t==='caster'?'#49356e':'#733848';x.beginPath();x.arc(e.x,e.y,e.r,0,6.28);x.fill();x.strokeStyle=e.t==='caster'?C.purple:C.red;x.stroke();x.fillStyle='#eee';x.fillRect(e.x-7,e.y-5,4,4);x.fillRect(e.x+3,e.y-5,4,4);x.fillStyle='#21101a';x.fillRect(e.x-7,e.y+7,14,3);x.fillStyle='#21151d';x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,3);x.fillStyle=C.red;x.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*(e.hp/e.max),3)}
for(let q of shots){x.fillStyle=C.purple;x.shadowColor=C.purple;x.shadowBlur=10;x.beginPath();x.arc(q.x,q.y,q.r,0,6.28);x.fill();x.shadowBlur=0}for(let q of ps){x.fillStyle=C.red;x.beginPath();x.arc(q.x,q.y,q.r,0,6.28);x.fill()}for(let p of parts){x.globalAlpha=Math.max(0,p.l/p.m);x.fillStyle=p.col;x.beginPath();x.arc(p.x,p.y,3,0,6.28);x.fill()}x.globalAlpha=1;if(P.inv<=0||Math.floor(P.inv*18)%2===0){x.save();x.translate(P.x,P.y);x.rotate(Math.atan2(aim.y,aim.x));x.fillStyle='#3b2b50';x.strokeStyle=C.hero;x.lineWidth=3;x.beginPath();x.moveTo(30,0);x.lineTo(-18,-14);x.lineTo(-8,0);x.lineTo(-18,14);x.closePath();x.fill();x.stroke();x.fillStyle=C.gold;x.fillRect(0,-5,12,10);if(P.cd>.05){x.strokeStyle=C.gold;x.lineWidth=5;x.beginPath();x.arc(0,0,50,-.65,.65);x.stroke()}x.restore()}}
function loop(t){if(!run)return;let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}
function stickMove(e){let r=stickEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m}joy.x=dx/m;joy.y=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}
const stickEl=document.getElementById('stick'),knob=document.getElementById('knob');stickEl.onpointerdown=e=>{joy.on=true;stickEl.setPointerCapture(e.pointerId);stickMove(e)};stickEl.onpointermove=e=>{if(joy.on)stickMove(e)};stickEl.onpointerup=stickEl.onpointercancel=()=>{joy.on=false;knob.style.transform='translate(0,0)'};
atk.onclick=attack;dash.onclick=dash;spec.onclick=special;start.onclick=start;retry.onclick=start;winretry.onclick=start;addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' ')attack();if(e.key==='Shift')dash();if(e.key.toLowerCase()==='q')special()});addEventListener('keyup',e=>keys[e.key]=0);
hud();
})();
</script></body></html>
