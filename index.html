<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Nokia Bounce Platformer</title><style>*{box-sizing:border-box;user-select:none}html,body{margin:0;height:100%;overflow:hidden;background:#142114;font-family:Courier New,monospace;touch-action:none}body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}#wrap{width:100%;max-width:700px}canvas{display:block;width:100%;height:auto;background:#9bc09b;border:6px solid #3b4e3b;border-radius:16px;box-shadow:0 0 20px #000}#hud{display:flex;justify-content:space-between;color:#d8ebc8;font-weight:bold;font-size:16px;padding:0 6px}#controls{width:100%;max-width:700px;display:flex;gap:10px}button{flex:1;border:0;border-radius:14px;padding:18px 8px;font:700 18px Courier New;color:#203020;background:#7fa87f;box-shadow:0 5px 0 #2b3e2b}button:active{transform:translateY(4px);box-shadow:0 1px 0 #2b3e2b}#jump{background:#a8d078;flex:1.3}#new{background:#d0a878}@media(max-height:600px){button{padding:12px;font-size:15px}#hud{font-size:13px}}</style></head><body><div id="wrap"><div id="hud"><span id="level">LEVEL 1</span><span id="score">RINGS: 0 / 6</span></div><canvas id="game" width="700" height="390"></canvas></div><div id="controls"><button id="left">◀ LEFT</button><button id="jump">⬆ JUMP</button><button id="right">RIGHT ▶</button><button id="new">↻ NEW</button></div><script>(()=>{const c=document.getElementById('game'),x=c.getContext('2d'),W=700,H=390,Lv=[{s:{x:55,y:300},g:{x:650,y:70},p:[[0,350,180,40],[230,300,120,18],[390,250,110,18],[535,195,105,18],[455,125,100,18],[610,85,80,18]],r:[[275,270],[440,220],[585,165],[505,95],[640,55],[125,320]]},{s:{x:45,y:285},g:{x:640,y:55},p:[[0,350,130,40],[165,315,90,18],[290,270,90,18],[420,320,85,18],[530,245,90,18],[405,180,85,18],[555,120,80,18],[620,75,80,18]],r:[[205,285],[330,240],[462,290],[575,215],[445,150],[595,90]]}],K={left:0,right:0};let li=0,b,rings,win=0,dead=0,score=0,cam=0;function load(){let l=Lv[li];b={x:l.s.x,y:l.s.y,vx:0,vy:0,ground:0};rings=l.r.map(a=>({x:a[0],y:a[1],a:1}));win=dead=score=cam=0;level.textContent='LEVEL '+(li+1);document.getElementById('score').textContent='RINGS: 0 / '+rings.length}function jump(){if(win||dead){load();return}if(b.ground){b.vy=-8.8;b.ground=0}}function update(){if(win||dead)return;let l=Lv[li];if(K.left)b.vx-=.22;if(K.right)b.vx+=.22;if(!K.left&&!K.right)b.vx*=.86;b.vx=Math.max(-4.5,Math.min(4.5,b.vx));b.vy+=.42;b.x+=b.vx;b.y+=b.vy;if(b.x<13){b.x=13;b.vx=Math.abs(b.vx)*.5}if(b.x>W-13){b.x=W-13;b.vx=-Math.abs(b.vx)*.5}b.ground=0;for(let q of l.p){let prev=b.y-b.vy+13;if(b.vy>=0&&prev<=q[1]&&b.y+13>=q[1]&&b.x+13>q[0]&&b.x-13<q[0]+q[2]){b.y=q[1]-13;b.vy=0;b.ground=1}}for(let q of rings)if(q.a&&Math.hypot(b.x-q.x,b.y-q.y)<25){q.a=0;score++;document.getElementById('score').textContent='RINGS: '+score+' / '+rings.length}if(Math.hypot(b.x-l.g.x,b.y-l.g.y)<30&&score===rings.length){if(li<Lv.length-1){li++;load()}else win=1}if(b.y>H+60)dead=1;cam=Math.max(0,Math.min(180,b.x-280))}function draw(){x.clearRect(0,0,W,H);x.save();x.translate(-cam,0);x.strokeStyle='#7fa87f';x.lineWidth=.5;for(let i=0;i<W;i+=25){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=25){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}let l=Lv[li];for(let q of l.p){x.fillStyle='#365636';x.fillRect(...q);x.fillStyle='#a8d078';x.fillRect(q[0],q[1],q[2],5)}let g=l.g;x.fillStyle='#d8ed9b';x.fillRect(g.x-4,g.y-25,8,43);x.beginPath();x.arc(g.x,g.y-28,18,0,7);x.strokeStyle='#f0f8b0';x.lineWidth=5;x.stroke();for(let q of rings)if(q.a){x.beginPath();x.arc(q.x,q.y,12,0,7);x.strokeStyle='#1e3a1e';x.lineWidth=5;x.stroke();x.beginPath();x.arc(q.x,q.y,9,0,7);x.strokeStyle='#f0f8b0';x.lineWidth=3;x.stroke()}x.beginPath();x.ellipse(b.x,b.y+15,14,5,0,0,7);x.fillStyle='rgba(40,60,40,.35)';x.fill();x.beginPath();x.arc(b.x,b.y,13,0,7);x.fillStyle='#222';x.fill();x.beginPath();x.arc(b.x-4,b.y-4,4,0,7);x.fillStyle='#c0e0c0';x.fill();x.restore();if(win||dead){x.fillStyle='rgba(20,35,20,.78)';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#f4efb0';x.font='bold 32px Courier New';x.fillText(win?'YOU WIN!':'GAME OVER',W/2,165);x.font='bold 16px Courier New';x.fillText('Tap JUMP to restart',W/2,205);x.textAlign='left'}}function loop(){update();draw();requestAnimationFrame(loop)}function hold(el,k){el.addEventListener('pointerdown',e=>{e.preventDefault();K[k]=1});['pointerup','pointercancel','pointerleave'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();K[k]=0}))}hold(document.getElementById('left'),'left');hold(document.getElementById('right'),'right');document.getElementById('jump').onclick=jump;document.getElementById('new').onclick=()=>{li=0;load()};onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='a')K.left=1;if(e.key==='ArrowRight'||e.key==='d')K.right=1;if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')jump();if(e.key==='r')li=0,load()};onkeyup=e=>{if(e.key==='ArrowLeft'||e.key==='a')K.left=0;if(e.key==='ArrowRight'||e.key==='d')K.right=0};load();loop()})()</script></body></html>
