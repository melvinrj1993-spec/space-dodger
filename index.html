<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Flappy Runner</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe4cc;touch-action:none}body{font-family:Georgia,serif}#game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#bfe5e0}canvas{width:100%;height:100%;display:block}#score{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:38px;font-weight:bold;color:#514b3d;text-shadow:2px 2px #f8efd5;pointer-events:none}#panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;pointer-events:none}.card{background:#f8efd5ee;border:3px solid #514b3d;border-radius:18px;padding:20px 26px;text-align:center;color:#514b3d;box-shadow:5px 6px #514b3d33}h1{margin:0 0 8px;font-size:30px}p{margin:0;font-size:17px;line-height:1.45}#again{display:none;margin-top:12px;padding:11px 20px;border:2px solid #514b3d;border-radius:12px;background:#e6c454;font:bold 16px Georgia;color:#514b3d}#buttons{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;justify-content:space-between;padding:0 16px;z-index:6}.group{display:flex;gap:10px}button.ctrl{width:70px;height:58px;border:3px solid #514b3d;border-radius:15px;background:#f8efd5e8;color:#514b3d;font:bold 25px Georgia;box-shadow:3px 4px #514b3d33;touch-action:none;user-select:none}#jump{width:92px;background:#e6c454;font-size:15px}#rotate{display:none}@media(orientation:portrait){#rotate{display:flex;position:absolute;inset:0;z-index:20;background:#f8efd5;align-items:center;justify-content:center;text-align:center;color:#514b3d;font-size:21px;padding:25px}#rotate div{border:3px solid #514b3d;border-radius:18px;padding:25px}}</style></head><body><div id="game"><canvas id="canvas"></canvas><div id="score">0</div><div id="panel"><div class="card"><h1 id="title">FLAPPY RUNNER</h1><p id="text">Run across the platforms<br><br>◀ ▶ Move &nbsp; • &nbsp; JUMP</p><button id="again">PLAY AGAIN</button></div></div><div id="buttons"><div class="group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div><button class="ctrl" id="jump">JUMP</button></div><div id="rotate"><div>📱<br><br>Rotate your iPhone<br>to landscape</div></div></div><script>(()=>{const c=document.getElementById('canvas'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),panel=document.getElementById('panel'),title=document.getElementById('title'),text=document.getElementById('text'),again=document.getElementById('again');let W=1000,H=600,D=1,state='ready',score=0,best=0,last=0,camera=0,keys={left:false,right:false},p,plats=[],coins=[],foes=[];try{best=+localStorage.getItem('flappyRunnerBest')||0}catch(e){}const ink='#514b3d',paper='#f8efd5',sky='#bfe5e0',green='#71985a',wood='#9a7652',yellow='#e6c454';function resize(){let r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}function line(a,w=2,A=1){x.save();x.strokeStyle=ink;x.globalAlpha=A;x.lineWidth=w;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(a[0][0],a[0][1]);for(let i=1;i<a.length;i++)x.lineTo(a[i][0]+(Math.random()-.5)*1.5,a[i][1]+(Math.random()-.5)*1.5);x.stroke();x.restore()}function plat(X,Y,w){return{x:X,y:Y,w,h:18}}function reset(){resize();state='ready';score=0;camera=0;p={x:110,y:H-150,w:38,h:40,vx:0,vy:0,on:false,dir:1,run:0};plats=[plat(-250,H-70,620),plat(500,H-145,190),plat(780,H-215,190),plat(1080,H-125,230),plat(1420,H-200,220),plat(1760,H-110,280)];coins=[];foes=[];for(let i=0;i<35;i++)coins.push({x:300+i*75,y:H-125-Math.random()*150,taken:false});for(let i=0;i<10;i++)foes.push({x:570+i*200,y:H-175+Math.random()*80,w:32,h:27,v:45+Math.random()*45});scoreEl.textContent='0';title.textContent='FLAPPY RUNNER';text.innerHTML='Run across the platforms<br><br>◀ ▶ Move &nbsp; • &nbsp; JUMP';again.style.display='none';panel.style.display='flex'}function start(){if(state==='ready'){state='playing';panel.style.display='none'}else if(state==='dead'){reset();state='playing';panel.style.display='none'}jump()}function jump(){if(state==='playing'&&p.on){p.vy=-530;p.on=false}}function extend(){let q=plats[plats.length-1];while(q.x+q.w<camera+W+450){let gap=75+Math.random()*70,w=140+Math.random()*130,y=Math.max(105,Math.min(H-75,q.y+(Math.random()-.5)*150));q=plat(q.x+q.w+gap,y,w);plats.push(q);coins.push({x:q.x+30+Math.random()*(w-60),y:q.y-50,taken:false});if(Math.random()<.4)foes.push({x:q.x+w/2,y:q.y-27,w:32,h:27,v:45+Math.random()*50})}}function die(){if(state!=='playing')return;state='dead';best=Math.max(best,score);try{localStorage.setItem('flappyRunnerBest',best)}catch(e){}title.textContent='GAME OVER';text.innerHTML='Score: <b>'+score+'</b><br>Best: <b>'+best+'</b>';again.style.display='inline-block';panel.style.display='flex'}function update(dt){if(state==='ready'){p.y=H-150+Math.sin(performance.now()/180)*4;return}if(state!=='playing')return;let dir=(keys.right?1:0)-(keys.left?1:0);p.vx+=(dir*900-p.vx)*Math.min(1,dt*8);if(!dir)p.vx*=Math.pow(.08,dt);p.x+=p.vx*dt;if(dir)p.dir=dir;p.run+=Math.abs(p.vx)*dt*.08;let oldBottom=p.y+p.h;p.vy+=1350*dt;p.y+=p.vy*dt;p.on=false;extend();for(const q of plats)if(p.x+p.w>q.x&&p.x<q.x+q.w&&oldBottom<=q.y&&p.y+p.h>=q.y&&p.vy>=0){p.y=q.y-p.h;p.vy=0;p.on=true}for(const co of coins)if(!co.taken&&Math.hypot(p.x+p.w/2-co.x,p.y+p.h/2-co.y)<29){co.taken=true;score++;scoreEl.textContent=score}for(const e of foes){if(e.y>H+300)continue;e.x+=e.v*dt;if(e.x<camera-150)e.x=camera+W+100;if(e.x>camera+W+150)e.x=camera-80;let hit=p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y;if(hit){if(p.vy>80&&p.y+p.h-e.y<20){e.y=H+500;p.vy=-390;score++;scoreEl.textContent=score}else{die();return}}}if(p.y>H+100)die();camera=Math.max(0,p.x-190)}function draw(){x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#a7c08c';for(let i=-1;i<9;i++){let bx=i*220-(camera*.12%220);x.beginPath();x.moveTo(bx,H-65);x.quadraticCurveTo(bx+110,H-180,bx+220,H-65);x.fill()}x.save();x.translate(-camera,0);for(const q of plats){x.fillStyle=wood;x.fillRect(q.x,q.y,q.w,q.h);x.fillStyle=green;x.fillRect(q.x,q.y-8,q.w,10);line([[q.x,q.y-7],[q.x+q.w,q.y-7]],2.5);for(let z=q.x+18;z<q.x+q.w;z+=36)line([[z,q.y+3],[z+12,q.y+13]],1,.4)}for(const co of coins)if(!co.taken){x.fillStyle=yellow;x.beginPath();x.arc(co.x,co.y,9,0,7);x.fill();line([[co.x,co.y-7],[co.x+4,co.y],[co.x,co.y+7],[co.x-4,co.y]],1.4)}for(const e of foes)if(e.y<H+100){x.fillStyle='#b46c55';x.fillRect(e.x,e.y,e.w,e.h);line([[e.x,e.y],[e.x+e.w,e.y],[e.x+e.w,e.y+e.h],[e.x,e.y+e.h],[e.x,e.y]],2);x.fillStyle=paper;x.fillRect(e.x+6,e.y+6,6,6);x.fillRect(e.x+20,e.y+6,6,6)}drawBird();x.restore()}function drawBird(){x.save();x.translate(p.x+p.w/2,p.y+p.h/2);x.scale(p.dir,1);x.fillStyle=yellow;x.beginPath();x.ellipse(0,-5,19,17,0,0,7);x.fill();line([[-18,-5],[-13,-18],[1,-22],[16,-14],[19,2],[13,14],[-4,17],[-18,9],[-18,-5]],2.5);x.fillStyle='#c89f3e';let s=Math.sin(p.run)*4;x.beginPath();x.ellipse(-7,6+s,11,6,-.2,0,7);x.fill();x.fillStyle=paper;x.beginPath();x.arc(9,-11,7,0,7);x.fill();x.fillStyle=ink;x.beginPath();x.arc(11,-11,2.5,0,7);x.fill();x.fillStyle='#d88b45';x.beginPath();x.moveTo(15,-6);x.lineTo(30,0);x.lineTo(15,7);x.closePath();x.fill();line([[15,-6],[30,0],[15,7]],1.7);x.strokeStyle=ink;x.lineWidth=4;x.beginPath();x.moveTo(-7,14);x.lineTo(-10,23);x.moveTo(8,14);x.lineTo(11,23);x.stroke();x.restore()}function loop(t){let dt=Math.min((t-last)/1000||0,.032);last=t;update(dt);draw();requestAnimationFrame(loop)}function hold(id,key){let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true},{passive:false});['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();keys[key]=false},{passive:false}))}hold('left','left');hold('right','right');document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();start()},{passive:false});again.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();reset()},{passive:false});document.addEventListener('keydown',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;if(e.code==='Space'||e.code==='ArrowUp')start()});document.addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false});window.addEventListener('resize',resize);reset();requestAnimationFrame(loop)})();</script></body></html>
